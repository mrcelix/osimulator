/* ===== Record & Play (guides) ===== */
.tb-btn.rec{color:#ff6b6b;font-weight:700}
.tb-btn.rec.on{background:#ff3b30;color:#fff}
.rec-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(140%);z-index:150;display:flex;align-items:center;gap:14px;background:rgba(20,20,26,.98);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px 16px;box-shadow:0 20px 50px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.2,.7,.2,1);max-width:92vw}
.rec-bar.show{transform:translateX(-50%)}
.rec-dot{width:11px;height:11px;border-radius:50%;background:#ff3b30;animation:recPulse 1.1s ease-in-out infinite;flex:none}
@keyframes recPulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,59,48,.5)}50%{opacity:.6;box-shadow:0 0 0 6px rgba(255,59,48,0)}}
.rec-info{font-size:13px;color:#e6e6ea;font-weight:600;white-space:nowrap}
.rec-info b{color:#fff}
.rec-info .hint{display:block;font-size:11px;color:#9a9aa6;font-weight:500;margin-top:1px;max-width:230px;white-space:normal}
.rec-bar button{height:36px;padding:0 15px;border-radius:10px;font-size:13px;font-weight:700}
.rec-fin{background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff}
.rec-can{background:rgba(255,255,255,.08);color:#d0d0d8;border:1px solid rgba(255,255,255,.14)}
.row.rec-pulse{animation:rowPulse .5s ease}
@keyframes rowPulse{0%{background:rgba(10,132,255,.28)}100%{background:transparent}}

/* highlight during playback */
.row.guide-hl{position:relative;box-shadow:inset 0 0 0 2px #0a84ff, 0 0 0 3px rgba(10,132,255,.35);border-radius:10px;animation:hlPulse 1.4s ease-in-out infinite}
@keyframes hlPulse{0%,100%{box-shadow:inset 0 0 0 2px #0a84ff,0 0 0 3px rgba(10,132,255,.28)}50%{box-shadow:inset 0 0 0 2px #4aa8ff,0 0 0 7px rgba(10,132,255,0)}}
.side-row.guide-hl{box-shadow:inset 0 0 0 2px #0a84ff;border-radius:10px}

/* coach bar (playback) */
.coach{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:150;width:min(440px,92vw);background:rgba(18,18,24,.98);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.14);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.6);padding:16px 18px;color:#fff;animation:coachIn .3s cubic-bezier(.2,.7,.2,1)}
@keyframes coachIn{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%)}}
.coach-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.coach-step{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#8b8bff}
.coach-x{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.1);color:#c8c8d0;display:flex;align-items:center;justify-content:center;font-size:13px}
.coach-note{font-size:15px;line-height:1.45;color:#f2f2f5;min-height:22px}
.coach-target{font-size:12.5px;color:#9a9aa6;margin-top:5px}
.coach-target b{color:#5cadff}
.coach-prog{display:flex;gap:5px;margin:12px 0}
.coach-prog span{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.14)}
.coach-prog span.done{background:#0a84ff}
.coach-prog span.cur{background:#5e5ce6}
.coach-btns{display:flex;gap:9px}
.coach-btns button{flex:1;height:42px;border-radius:11px;font-size:14px;font-weight:700}
.coach-next{background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff}
.coach-prev{background:rgba(255,255,255,.08);color:#e6e6ea;border:1px solid rgba(255,255,255,.14);flex:0 0 92px}

/* guide start / done / list cards reuse .auth-modal; extra bits */
.guide-hero{text-align:center}
.guide-hero .gmk{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.guide-hero .gmk svg{width:30px;height:30px;fill:#fff}
.guide-meta{font-size:13px;color:#9a9aa6;margin:4px 0 2px}
.guide-list{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.guide-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);text-align:left}
.guide-card .gi{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:flex;align-items:center;justify-content:center;flex:none}
.guide-card .gi svg{width:19px;height:19px;fill:#fff}
.guide-card .gt{flex:1;min-width:0}
.guide-card .gt .n{font-size:14px;font-weight:700;color:#f2f2f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guide-card .gt .m{font-size:12px;color:#9a9aa6}
.guide-card .ga{display:flex;gap:6px}
.guide-card .ga button{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.08);color:#d0d0d8;display:flex;align-items:center;justify-content:center}
.guide-card .ga button svg{width:16px;height:16px;fill:currentColor}
.guide-card .ga button.play{background:#0a84ff;color:#fff}
.step-edit{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.step-edit .sn{width:24px;height:24px;border-radius:50%;background:rgba(10,132,255,.2);color:#5cadff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:6px}
.step-edit .se-body{flex:1;min-width:0}
.step-edit .se-tap{font-size:12.5px;color:#9a9aa6;margin-bottom:5px}.step-edit .se-tap b{color:#e6e6ea}
.step-edit input{width:100%;height:38px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;padding:0 12px;font-size:13px;outline:none;font-family:inherit}
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.share-grid.full{grid-template-columns:1fr}
.share-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#e6e6ea;font-size:13.5px;font-weight:600;text-align:left}
.share-btn:hover{background:rgba(255,255,255,.11)}
.share-btn svg{width:18px;height:18px;fill:currentColor;flex:none}
.share-link{display:flex;gap:8px;margin:2px 0 10px}
.share-link input{flex:1;height:42px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#c9c9d2;padding:0 12px;font-size:12.5px;outline:none;font-family:inherit}
.share-link button{height:42px;padding:0 16px;border-radius:11px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-weight:700;font-size:13px}
.embed-box{width:100%;height:70px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#c9c9d2;padding:10px 12px;font-size:11.5px;font-family:ui-monospace,monospace;outline:none;resize:none;margin-top:4px}
/* light theme bits */
body.light .rec-bar,body.light .coach,body.light .guide-card,body.light .step-edit input,body.light .share-btn,body.light .share-link input,body.light .embed-box{background:#fff;border-color:rgba(0,0,0,.1);color:#1c1c22}
body.light .rec-info,body.light .coach-note{color:#1c1c22}
body.light .guide-card .gt .n{color:#141418}
body.light .share-btn{color:#33333a}
body.light .step-edit input{color:#111}

/* ===== new frames: Linux / ChromeOS / Watch ===== */
.stage.frame-linux{background:linear-gradient(160deg,#2c0b1e 0%,#5b2333 45%,#c0603a 100%)}
.stage.frame-chromeos{background:linear-gradient(160deg,#0a2a5a 0%,#1a63d0 55%,#8ab4f8 100%)}
.stage.frame-watch{background:radial-gradient(120% 120% at 50% 30%,#26263a 0%,#0b0b0f 70%)}
/* GNOME */
.gnome-desktop{position:absolute;inset:0}
.gnome-top{position:absolute;top:0;left:0;right:0;height:30px;background:rgba(20,10,15,.72);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff;font-size:13px;font-weight:600;z-index:5}
.gnome-top .gt-clock{position:absolute;left:0;right:0;text-align:center;font-weight:500;pointer-events:none}
.gnome-top .gt-sys{display:flex;gap:10px}.gnome-top .gt-sys svg{width:16px;height:16px;fill:#fff}
.gnome-dock{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;padding:10px 8px;border-radius:18px;background:rgba(20,10,15,.5);backdrop-filter:blur(18px);z-index:4}
.gd-app{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;transition:transform .15s;position:relative}
.gd-app:hover{transform:scale(1.08)}
.gd-app svg{width:28px;height:28px}
.gd-app.run::after{content:"";position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:2px;background:#e95420}
.gnomewin{position:absolute;left:50%;top:calc(50% - 4px);transform:translate(-50%,-50%);width:82%;aspect-ratio:1100/720;background:#faf9f8;border-radius:12px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5);display:flex;flex-direction:column}
.gnome-hb{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 18px;background:#f6f5f4;border-bottom:1px solid rgba(0,0,0,.08)}
.gnome-title{font-size:14px;font-weight:700;color:#2a2a2a}
.gnome-x{width:30px;height:30px;border-radius:50%;background:#e4e2e0;color:#333;font-size:14px}
.gnome-x:hover{background:#d4302a;color:#fff}
.gnomewin .win-body{flex:1;position:relative;overflow:hidden}
/* ChromeOS */
.cros-desktop{position:absolute;inset:0}
.cros-shelf{position:absolute;left:0;right:0;bottom:0;height:56px;background:rgba(255,255,255,.16);backdrop-filter:blur(24px);display:flex;align-items:center;padding:0 14px;z-index:5}
.cros-launcher{width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);flex:none;position:relative}
.cros-launcher::after{content:"";position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle,#4285f4 0 40%,#ea4335 41% 60%,#fbbc04 61% 80%,#34a853 81%)}
.cros-apps{display:flex;gap:12px;margin:0 auto;padding-left:32px}
.cros-app{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;transition:transform .15s;position:relative}
.cros-app:hover{transform:translateY(-3px)}
.cros-app svg{width:24px;height:24px}
.cros-app.run::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#fff}
.cros-status{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:100px;color:#fff;font-size:13px;font-weight:600;background:rgba(0,0,0,.28)}
.cros-status svg{width:16px;height:16px;fill:#fff}
.croswin{position:absolute;left:50%;top:calc(50% - 12px);transform:translate(-50%,-50%);width:80%;aspect-ratio:1100/720;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5);display:flex;flex-direction:column}
.cros-hb{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 22px;background:#fff;border-bottom:1px solid #eee}
.cros-title{font-size:15px;font-weight:600;color:#202124}
.cros-x{width:32px;height:32px;border-radius:50%;color:#5f6368;font-size:14px}
.cros-x:hover{background:#f1f3f4}
.croswin .win-body{flex:1;position:relative;overflow:hidden;background:#fff}
.croswin .settings .sidebar{background:#fff}
/* Watch */
.device.device-watch{background:#0a0a0a;padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 3px #232327,0 0 0 8px #050505;position:relative}
.device.device-watch.watch-square{width:min(300px,72vw);aspect-ratio:300/362;border-radius:66px}
.device.device-watch.watch-round{width:min(320px,74vw);aspect-ratio:1/1;border-radius:50%}
.device.device-watch .screen{inset:12px;background:#000}
.device.device-watch.watch-square .screen{border-radius:52px}
.device.device-watch.watch-round .screen{border-radius:50%}
.watch-crown{position:absolute;right:-6px;top:38%;width:8px;height:44px;border-radius:5px;background:linear-gradient(90deg,#3a3a3e,#1a1a1e);box-shadow:0 0 0 1px #050505}
.watch-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.watch-face.wear{justify-content:center}
.wf-date{font-size:13px;font-weight:700;letter-spacing:.08em;color:#ff9f0a;margin-bottom:2px}
.watch-face.wear .wf-date{color:#8ab4f8}
.wf-time{font-size:56px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.wf-comps{display:flex;gap:12px;margin-top:12px;font-size:13px;font-weight:600}
.wf-c.red{color:#ff375f}.wf-c.green{color:#30d158}.wf-c.orange{color:#ff9f0a}
.wf-open{margin-top:20px;padding:8px 18px;border-radius:100px;background:rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:600}
.wf-open:hover{background:rgba(255,255,255,.26)}
/* watch settings (reuses phone settings) */
.device-watch .settings.phone{font-size:13px}
.device-watch .big-title{font-size:22px}
.device-watch .phone-topbar{margin-top:6px;height:34px}
.device-watch .statusbar{height:20px;font-size:11px;padding:0 16px}
.device-watch .ph-title{font-size:14px}
.device-watch .row{min-height:40px}
.device-watch.watch-round .phone-scroll{padding-left:8%;padding-right:8%}

/* ===== TV frame (tvOS / Google TV) ===== */
.stage.frame-tv{background:radial-gradient(120% 120% at 50% 25%,#20243a 0%,#07080f 72%)}
.device.device-tv{position:relative;background:#080808;border-radius:16px;padding:10px;box-shadow:0 50px 90px rgba(0,0,0,.6),0 0 0 2px #26262a,0 0 0 7px #050505;width:min(1120px,94vw);aspect-ratio:16/9}
.device.device-tv .screen{inset:10px;border-radius:8px;background:#000}
.tv-stand{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);width:22%;height:22px;background:linear-gradient(180deg,#2a2a2e,#111);border-radius:0 0 10px 10px;box-shadow:0 14px 24px rgba(0,0,0,.5)}
.tv-home{position:absolute;inset:0;color:#fff;display:flex;flex-direction:column;padding:5% 6%}
.tv-top{display:flex;align-items:center;justify-content:space-between;font-size:22px;font-weight:600}
.tv-top .avatar{width:38px;height:38px;font-size:14px}
.tv-shelf{display:flex;gap:2.4%;margin-top:auto;padding:14px 2px}
.tv-tile{flex:1;aspect-ratio:1.6/1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;transition:transform .18s,box-shadow .18s;position:relative;min-width:0}
.tv-tile svg{width:34px;height:34px}
.tv-tile .tv-lbl{font-size:14px;font-weight:600;position:absolute;bottom:-26px;left:0;right:0;text-align:center;opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-tile.focus,.tv-tile:hover{transform:scale(1.12);box-shadow:0 0 0 4px #fff,0 20px 40px rgba(0,0,0,.5);z-index:2}
.tv-tile.focus .tv-lbl,.tv-tile:hover .tv-lbl{opacity:1}
.tv-tile.sm{aspect-ratio:1.5/1;border-radius:12px}
.tvos .tv-shelf{margin-top:auto}
/* Google TV */
.gtv{padding:4% 5%}
.gtv-top{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600}
.gtv-tabs{display:flex;gap:22px;color:rgba(255,255,255,.6)}
.gtv-tabs .on{color:#fff;border-bottom:2px solid #8ab4f8;padding-bottom:4px}
.gtv-right{display:flex;align-items:center;gap:16px}
.gtv-right svg{width:22px;height:22px;fill:#fff}
.gtv-right .avatar{width:32px;height:32px;font-size:12px}
.gtv-gear svg{fill:#fff}
.gtv-rowlabel{font-size:15px;font-weight:600;margin:18px 2px 8px;color:#e6e6ea}
.tv-shelf.posters{margin-top:0;gap:1.8%}
.tv-poster{flex:1;aspect-ratio:2/3;border-radius:10px;display:flex;align-items:flex-end;padding:10px;font-size:13px;font-weight:600;transition:transform .18s,box-shadow .18s;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.tv-poster.focus,.tv-poster:hover{transform:scale(1.06);box-shadow:0 0 0 3px #fff,0 16px 30px rgba(0,0,0,.5);z-index:2}
.gtv .tv-shelf{margin-top:0;padding:6px 2px}
.gtv .tv-tile{max-width:150px}

/* ===== Car (CarPlay / Android Auto) ===== */
.stage.frame-car{background:radial-gradient(120% 120% at 50% 30%,#10151f 0%,#05060b 72%)}
.device.device-car{aspect-ratio:16/9;border-radius:20px}
.car-home{position:absolute;inset:0;display:flex;color:#fff}
.car-home.carplay{padding:0}
.car-side{width:64px;flex:none;background:rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:14px}
.car-home-btn{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.car-home-btn svg{width:24px;height:24px;fill:#fff}
.car-side .car-time{font-size:15px;font-weight:700;margin-top:auto}
.car-sig{display:flex;gap:4px}.car-sig svg{width:14px;height:14px;fill:#fff}
.car-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:3%;padding:5% 5%;align-content:center}
.car-tile{border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:14px;font-weight:600;transition:transform .15s}
.car-tile:hover{transform:scale(1.05)}
.car-tile svg{width:34px;height:34px}
.aauto .car-grid{grid-template-columns:repeat(4,1fr);padding-bottom:80px}
.aauto-bar{position:absolute;left:0;right:0;bottom:0;height:60px;background:rgba(0,0,0,.5);display:flex;align-items:center;gap:14px;padding:0 20px}
.aa-time{font-size:15px;font-weight:700;margin-right:auto}
.aa-b{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.aa-b svg{width:24px;height:24px;fill:#fff}
/* ===== Console (PS5 / Xbox) ===== */
.stage.frame-console{background:radial-gradient(120% 120% at 50% 25%,#0e1830 0%,#05070f 72%)}
.device.device-console{aspect-ratio:16/9}
.console-home{position:absolute;inset:0;color:#fff;display:flex;flex-direction:column;padding:4% 5%}
.con-top{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600}
.con-user{display:flex;align-items:center;gap:10px}.con-user .avatar{width:34px;height:34px;font-size:13px}
.con-right{display:flex;align-items:center;gap:16px}
.con-right svg{width:22px;height:22px;fill:#fff}
.con-hero{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6% 2px 3%}
.con-row{display:flex;gap:2.2%;margin-top:auto;padding-bottom:6%}
.con-card{flex:1;aspect-ratio:1.15/1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:14px;font-weight:600;transition:transform .18s,box-shadow .18s}
.con-card svg{width:38px;height:38px}
.con-card.focus,.con-card:hover{transform:scale(1.08);box-shadow:0 0 0 4px #fff,0 18px 36px rgba(0,0,0,.5);z-index:2}
.ps .con-hero{color:#cfe4ff}.xbox .con-hero{color:#c8f0c8}
/* ===== visionOS ===== */
.stage.frame-vision{background:radial-gradient(120% 120% at 50% 40%,#20304a 0%,#070c14 75%)}
.device.device-vision{aspect-ratio:21/9;border-radius:120px/60px;padding:16px;background:#050608;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 3px #1c1c22,0 0 0 8px #050505}
.device.device-vision .screen{border-radius:100px/48px}
.vision-space{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.vision-glow{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:40%;height:40%;border-radius:50%;background:radial-gradient(circle,rgba(140,180,255,.25),transparent 70%);filter:blur(30px)}
.vision-bar{display:flex;gap:22px;padding:0 0 6% 0;z-index:2}
.vis-app{transition:transform .18s}
.vis-app:hover{transform:scale(1.14) translateY(-6px)}
.vis-ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);backdrop-filter:blur(20px);box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.25)}
.vis-ic svg{width:34px;height:34px}
.vision-win{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:64%;height:66%;background:rgba(30,34,44,.72);backdrop-filter:blur(40px);border-radius:26px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.2);display:flex;flex-direction:column}
.vision-hb{height:46px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px}
.vision-x{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:13px}
.vision-title{color:#fff;font-weight:700;font-size:15px}
.vision-win .win-body{flex:1;position:relative;overflow:hidden;background:rgba(255,255,255,.9)}
/* ===== Windows 7 (Aero) ===== */
.stage.frame-winclassic{background:linear-gradient(160deg,#0a3d62,#1e6fa8)}
.w7-desktop{position:absolute;inset:0}
.w7-icons{position:absolute;top:16px;left:14px;display:flex;flex-direction:column;gap:18px}
.w7-desktop .desk-ic{display:flex;flex-direction:column;align-items:center;gap:5px;width:80px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.w7-desktop .di{width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.w7-desktop .di svg{width:36px;height:36px}
.w7-taskbar{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:3px;padding:0 4px;background:linear-gradient(180deg,rgba(40,90,150,.9),rgba(10,40,80,.92));border-top:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.w7-start{width:52px;height:38px;border-radius:50%/60%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#7fd0ff,#1a6fd0);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.w7-start svg{width:24px;height:24px}
.w7-task{width:40px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.w7-task svg{width:22px;height:22px}
.w7-task.run{background:rgba(255,255,255,.28)}
.w7-tray{margin-left:auto;display:flex;align-items:center;gap:8px;color:#fff;font-size:11px;padding-right:6px}
.w7-tray svg{width:15px;height:15px;fill:#fff}
.w7-clk{text-align:center;line-height:1.15}
.w7-start-menu{position:absolute;left:4px;bottom:40px;width:min(520px,80%);height:min(440px,68%);background:linear-gradient(180deg,rgba(20,60,110,.96),rgba(10,40,80,.97));border:1px solid rgba(255,255,255,.35);border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.5);display:flex;overflow:hidden;z-index:7}
.w7-sm-left{flex:1;background:rgba(255,255,255,.94);padding:10px}
.w7-sm-item{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:3px;font-size:13px;color:#111}
.w7-sm-item:hover{background:#cfe4ff}
.w7-sm-right{width:180px;background:rgba(0,0,0,.14);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.w7-sm-user{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:13px;font-weight:600;margin-bottom:10px}
.w7-sm-user .avatar{width:40px;height:40px}
.w7-sm-place{text-align:left;padding:6px 10px;border-radius:3px;font-size:12.5px;color:#fff}
.w7-sm-place:hover{background:rgba(255,255,255,.18)}
.w7-shutdown{margin-top:auto;padding:8px;border-radius:3px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:600}
.w7-win{position:absolute;left:50%;top:calc(50% - 20px);transform:translate(-50%,-50%);width:80%;aspect-ratio:1000/640;background:#f0f0f0;border:1px solid rgba(255,255,255,.6);border-radius:8px 8px 6px 6px;overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.5);display:flex;flex-direction:column}
.w7-tb{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;background:linear-gradient(180deg,#eaf3ff,#cfe4ff);border-bottom:1px solid #b8d4f0}
.w7-tb-title{font-size:12px;color:#1b3a5a}
.w7-tb-btns{display:flex;gap:2px}.w7-tb-btns span{width:28px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:3px;color:#1b3a5a}
.w7-close:hover{background:#e04030;color:#fff}
.w7-win .win-body{flex:1;position:relative;overflow:hidden;background:#f0f0f0}
/* ===== Mac OS X (Aqua) ===== */
.stage.frame-macclassic{background:linear-gradient(160deg,#3b5a8e,#16294a)}
.macx-desktop{position:absolute;inset:0}
.macx-menubar{position:absolute;top:0;left:0;right:0;height:24px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(232,236,242,.92));backdrop-filter:blur(8px);display:flex;align-items:center;gap:16px;padding:0 12px;font-size:13px;color:#1a1a1a;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.macx-apple svg{width:15px;height:15px;fill:#333}
.macx-app{font-weight:700}
.macx-menus{display:flex;gap:14px}
.macx-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.macx-right svg{width:15px;height:15px;fill:#333}
.macx-dock{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:10px;padding:6px 12px;border-radius:18px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(16px)}
.macx-dapp{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.macx-dapp:hover{transform:translateY(-8px) scale(1.1)}
.macx-dapp svg{width:32px;height:32px}
.macx-win{position:absolute;left:50%;top:calc(50% - 10px);transform:translate(-50%,-50%);width:60%;aspect-ratio:720/560;background:#ececec;border-radius:10px;overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.5);display:flex;flex-direction:column}
.macx-tb{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(180deg,#e4e4e6,#cfcfd4);border-bottom:1px solid rgba(0,0,0,.12);position:relative}
.macx-title{position:absolute;left:0;right:0;text-align:center;font-size:12px;font-weight:600;color:#3a3a3c}
.macx-win .win-body{flex:1;position:relative;overflow:hidden;background:#ececec}

/* ============================ DATA BUILDERS ============================ */
const T=(label,value,o={})=>Object.assign({type:'toggle',label,value},o);
const L=(label,o={})=>Object.assign({type:'link',label},o);
const V=(label,value,o={})=>Object.assign({type:'value',label,value},o);
const B=(label,o={})=>Object.assign({type:'button',label},o);
const CH=(label,selected)=>({type:'check',label,selected:!!selected});
const NOTE=text=>({type:'note',text});
const SL=(value,min,max)=>({type:'slider',value,minGlyph:min,maxGlyph:max});
const D=(title,sections)=>({title,sections});
const S=(rows,o={})=>Object.assign({rows},o);
// checkbox group builder: options + selected index
const CHOICE=(header,opts,sel,footer)=>S(opts.map((o,i)=>CH(o,i===sel)),{header,footer});
// per-app location permission page
const locPage=(name,mode)=>L(name,{value:mode,detail:D(name,[
  CHOICE('Allow Location Access',['Never','Ask Next Time Or When I Share','While Using the App'],mode==='Never'?0:mode==='Ask'?1:2),
  S([T('Precise Location',true)],{footer:'Allows '+name+' to use your specific location. With this off, apps can only determine your approximate location.'})
])});
// generic per-app permission list page (Contacts/Photos/etc.)
const permPage=(title,apps)=>D(title,[S(apps.map(a=>T(a,Math.random>2)),{footer:'Applications that have requested access to your '+title.toLowerCase()+' will appear here.'})]);
// app settings page in the app list
const appPage=(name,ic,bg,rows)=>L(name,{icon:ic,iconBg:bg,detail:D(name,rows)});

 };

 /* ---- realistic per-OS Settings icons (generated gears) ---- */
 function gearShape(o){
  let teeth='';
  for(let i=0;i<o.teeth;i++){
   const a=(i*(360/o.teeth)).toFixed(1);
   teeth+=`<rect x="${(o.cx-o.tw/2).toFixed(2)}" y="${(o.cy-o.rTip).toFixed(2)}" width="${o.tw}" height="${(o.rTip-o.rBody+1.5).toFixed(2)}" rx="${(o.tw*0.42).toFixed(2)}" transform="rotate(${a} ${o.cx} ${o.cy})"/>`;
  }
  return `<g fill="${o.color}">${teeth}<circle cx="${o.cx}" cy="${o.cy}" r="${o.rBody}"/></g><circle cx="${o.cx}" cy="${o.cy}" r="${o.rHole}" fill="${o.hole}"/>`;
 }
 function appleSettingsSVG(){
  const g=(cx,cy,rt,rb,rh,teeth,tw)=>gearShape({cx,cy,rTip:rt,rBody:rb,rHole:rh,teeth,tw,color:'#8a8a8f',hole:'#ededf0'});
  return `<svg viewBox="0 0 24 24">${g(6.2,6.4,3.6,2.4,1,7,1.3)}${g(18,17.4,3.5,2.3,.95,7,1.25)}${g(12,11.4,7.7,5.3,2.2,9,2.3)}</svg>`;
 }
 function androidSettingsSVG(){
  return `<svg viewBox="0 0 24 24">${gearShape({cx:12,cy:12,rTip:9.6,rBody:6.6,rHole:2.9,teeth:8,tw:3.1,color:'#fff',hole:'#5f6368'})}</svg>`;
 }
 function windowsSettingsSVG(color,hole){
  return `<svg viewBox="0 0 24 24">${gearShape({cx:12,cy:12,rTip:9.6,rBody:6.4,rHole:3.1,teeth:6,tw:3.6,color:color||'currentColor',hole:hole||'#0067c0'})}</svg>`;
 }
 function settingsGlyph(osid){
  if(osid==='android')return {bg:'#5f6368',svg:androidSettingsSVG()};

 function sparkleBurst(){
  const fab=document.querySelector('.fab-main');
  const r=fab?fab.getBoundingClientRect():{left:40,top:window.innerHeight-40,width:36,height:36};
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  const layer=el('<div class="spark-layer"></div>');document.body.appendChild(layer);
  const COL=['#ffffff','#8fd0ff','#c9a6ff','#7ee0c0','#ffd68f'];
  for(let i=0;i<30;i++){
   const a=Math.random()*Math.PI*2,dist=60+Math.random()*170;
   const s=el('<span class="spark"></span>');
   s.style.left=cx+'px';s.style.top=cy+'px';
   s.style.setProperty('--dx',(Math.cos(a)*dist).toFixed(1)+'px');
   s.style.setProperty('--dy',(Math.sin(a)*dist-40).toFixed(1)+'px');
   s.style.background='radial-gradient(circle,#fff 0%,'+COL[i%COL.length]+' 45%,transparent 72%)';
   s.style.animationDelay=(Math.random()*.12).toFixed(2)+'s';
   const sz=(7+Math.random()*10).toFixed(0)+'px';s.style.width=sz;s.style.height=sz;
   layer.appendChild(s);
  }
  setTimeout(()=>layer.remove(),1300);
 }

 function osAnswer(q){const s=q.toLowerCase();
  if(/^(hi|hey|hello|selam|merhaba|hola)\b/.test(s))return {a:"Hi! I'm OS AI 🤖 — ask me how to do things on iPadOS, iOS, macOS, Windows or Android (Wi‑Fi, eSIM, dark mode, screenshots, reset…)."};
  if(/(what can you|who are you|help|ne yapabilir|yardım)/.test(s))return {a:"I can explain how to do common tasks across all five operating systems here — connectivity, cellular & eSIM, appearance, updates, battery, security, accessibility and more. If a device is open, I can jump you straight to the right Settings screen. Try one of the suggestions below."};
  for(const e of AIKB){if(e.kw.some(k=>s.includes(k)))return e;}
  return {a:"I'm a local demo assistant, so I answer common OS how‑to questions. Try asking about Wi‑Fi, Bluetooth, cellular/eSIM, dark mode, updates, battery, screenshots, reset, storage, security or accessibility."};
 }
 function aiSheet(){
  const node=el(`<div class="sheet ai-sheet" style="height:min(680px,88vh)">
    <div class="sheet-hd"><span class="sh-ic" style="background:linear-gradient(150deg,#0a84ff,#5e5ce6)"><svg viewBox="0 0 24 24">${I.siri}</svg></span><div style="flex:1"><h3>OS AI</h3><div class="sub">Ask about iPadOS · iOS · macOS · Windows · Android</div></div><button class="sheet-x">✕</button></div>
    <div class="chat-log"></div>
    <div class="chat-sugs"></div>
    <div class="ai-disclaim">Local demo assistant — general OS guidance, not connected to the internet.</div>
    <div class="chat-input"><input placeholder="${esc(txt('ask'))}"><button class="chat-send"><svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg></button></div>
  </div>`);
  node.querySelector('.sheet-x').addEventListener('click',closePanels);
  const log=node.querySelector('.chat-log'),sugs=node.querySelector('.chat-sugs'),inp=node.querySelector('input');
  if(!AICHAT.length)AICHAT.push({role:'ai',a:"Hi! I'm OS AI 🤖 — I can explain how to do things on any of the five operating systems here, and open the right Settings screen for you. What do you need?"});
  const render=()=>{log.innerHTML='';AICHAT.forEach(m=>{const div=el(`<div class="msg ${m.role==='ai'?'ai':'me'}">${esc(m.a).replace(/\n/g,'<br>')}</div>`);
    if(m.role==='ai'&&m.cat&&state.platform&&m.cat[state.platform.id]){const cid=m.cat[state.platform.id];const s=SETTINGS[state.platform.id];const it=s&&s.sidebar.find(x=>x.id===cid);if(it&&it.detail){const btn=el(`<a class="act">↗ Open “${esc(dt(it.title||'Settings'))}”</a>`);btn.addEventListener('click',()=>{openCategory(cid);closePanels();});div.appendChild(document.createElement('br'));div.appendChild(btn);}}
    log.appendChild(div);});log.scrollTop=log.scrollHeight;};
  ['How do I turn on Wi‑Fi?','Add an eSIM','Enable dark mode','Take a screenshot','Reset my device'].forEach(sq=>{const c=el(`<button class="chat-sug">${sq}</button>`);c.addEventListener('click',()=>{send(sq);});sugs.appendChild(c);});
  const send=(q)=>{q=(q||inp.value).trim();if(!q)return;inp.value='';AICHAT.push({role:'me',a:q});const ans=osAnswer(q);AICHAT.push({role:'ai',a:ans.a,cat:ans.cat});render();};
  node.querySelector('.chat-send').addEventListener('click',()=>send());
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
  return {node,init:render};
 }
 function openCategory(catId){if(!state.platform)return false;const id=state.platform.id,s=SETTINGS[id];if(!s)return false;const item=s.sidebar.find(x=>x.id===catId);if(!item||!item.detail)return false;const f=state.platform.frame;state.selectedId=catId;state.stack=[item.detail];if(f==='mac'||f==='win')state.winOpen=true;else state.view='settings';renderDevice();return true;}

 function feedbackSheet(){
  let rating=0,cat='Idea',done=false;
  const node=el(`<div class="sheet"><div class="sheet-hd"><span class="sh-ic" style="background:#ff9500"><svg viewBox="0 0 24 24">${I.notifications}</svg></span><div style="flex:1"><h3>${esc(txt('feedback'))}</h3><div class="sub">Help us improve osimulator</div></div><button class="sheet-x">✕</button></div><div class="sheet-body"></div></div>`);
  node.querySelector('.sheet-x').addEventListener('click',closePanels);
  const body=node.querySelector('.sheet-body');
  const paint=()=>{
   if(done){body.innerHTML=`<div class="fb-done"><div class="big">🎉</div><h4>Thank you!</h4><p>Your feedback was recorded on this device.</p></div><button class="btn-ghost" style="margin-top:8px">Close</button>`;body.querySelector('.btn-ghost').addEventListener('click',closePanels);return;}
   body.innerHTML=`<div class="fb-stars">${[1,2,3,4,5].map(i=>`<span class="fb-star ${i<=rating?'on':''}" data-r="${i}">★</span>`).join('')}</div>
     <div class="fld"><label>Category</label><div class="chip-row">${['Bug','Idea','Praise','Other'].map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('')}</div></div>
     <div class="fld"><label>Your message</label><textarea placeholder="What's on your mind?"></textarea></div>
     ${USER?'':'<div class="fld"><label>Email (optional)</label><input type="email" placeholder="you@example.com"></div>'}
     <button class="btn-primary">Send feedback</button>`;
   body.querySelectorAll('.fb-star').forEach(s=>s.addEventListener('click',()=>{rating=+s.dataset.r;paint();}));
   body.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{cat=c.dataset.c;paint();}));
   body.querySelector('.btn-primary').addEventListener('click',()=>{const msg=body.querySelector('textarea').value.trim();if(!rating&&!msg){body.querySelector('textarea').focus();return;}const list=store.get('feedback',[]);list.push({rating,cat,msg,at:Date.now(),user:USER?USER.email:(body.querySelector('input')?body.querySelector('input').value:'')});store.set('feedback',list);done=true;paint();});
  };paint();
  return {node};
 }

 function accountSheet(){

     <button class="btn-primary" id="pf-save">Save preferences</button>
     <button class="btn-ghost" id="pf-out" style="margin-top:10px">Sign out</button>`;
    body.querySelector('#pf-save').addEventListener('click',()=>{
      USER.name=body.querySelector('#pf-name').value.trim()||USER.name;
      USER.prefs={lang:body.querySelector('#pf-lang').value,deviceLang:body.querySelector('#pf-dlang').value,defaultOS:body.querySelector('#pf-os').value};

     <p style="font-size:11px;color:#71717e;text-align:center;margin:12px 0 0">Demo membership — stored only in this browser. No real account is created.</p>`;
    body.querySelector('#g-btn').addEventListener('click',()=>doAuth('John Wick','johnwick@gmail.com','google'));

  };paint();
  return {node};

  REC.active=true;REC.steps=[];REC.os=state.platform.id;REC.ver=state.version;REC.lang=state.deviceLang;
  document.addEventListener('click',recCapture,true);

 function recCapture(e){
  if(!REC.active)return;
  const side=e.target.closest('.side-row');
  if(side){if(side.dataset.id==='account')return;const l=side.querySelector('.row-label');if(!l)return;const lab=l.textContent.trim();if(!lab)return;const isT=!!side.querySelector('.tgl');REC.steps.push({path:[],label:lab,kind:isT?'toggle':'nav',note:''});side.classList.add('rec-pulse');setTimeout(()=>side.classList.remove('rec-pulse'),500);updateRecBar();return;}
  const row=e.target.closest('.settings .row');
  if(!row||row.classList.contains('note')||row.classList.contains('storage')||row.classList.contains('wp-row'))return;
  const lblEl=row.querySelector('.row-label');if(!lblEl)return;
  const label=lblEl.textContent.trim();if(!label)return;
  let kind='tap';
  if(row.querySelector('.tgl'))kind='toggle';
  else if(row.classList.contains('check-row'))kind='check';
  else if(row.classList.contains('btn-row'))kind='button';
  else if(row.classList.contains('tappable')&&!row.classList.contains('dead')&&row.querySelector('.chev'))kind='nav';
  REC.steps.push({path:stackTitles(),label,kind,note:''});
  row.classList.add('rec-pulse');setTimeout(()=>row.classList.remove('rec-pulse'),500);
  updateRecBar();
 }

  m.querySelectorAll('[data-sh]').forEach(b=>b.addEventListener('click',()=>{
   const k=b.dataset.sh;
   if(k==='native'){if(navigator.share)navigator.share({title,text:title,url:link}).catch(()=>{});else{try{navigator.clipboard.writeText(link);}catch(e){}savedToast(t('linkCopied'));}return;}
   if(k==='dl'){downloadGuide(g);return;}
   let u='';
   if(k==='x')u='https://twitter.com/intent/tweet?text='+enc+'&url='+elink;
   else if(k==='wa')u='https://wa.me/?text='+enc+'%20'+elink;
   else if(k==='tg')u='https://t.me/share/url?url='+elink+'&text='+enc;
   else if(k==='mail')u='mailto:?subject='+enc+'&body='+elink;
   if(u)window.open(u,'_blank','noopener');
  }));
 }
 function downloadGuide(g){try{const blob=new Blob([JSON.stringify(g,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(g.title||'guide').replace(/[^\w\-]+/g,'_').slice(0,40)+'.osguide.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}catch(e){}}
 /* --- my guides --- */
 function myGuidesModal(){
  closePanels();
  const gs=loadGuides();
  const o=el('<div class="ovl show auth-ovl"><div class="ovl-bg"></div></div>');document.body.appendChild(o);
  const body=gs.length?`<div class="guide-list">${gs.map(g=>{const pf=PLATFORMS.find(p=>p.id===g.os);return `<div class="guide-card" data-id="${g.id}"><span class="gi"><svg viewBox="0 0 24 24">${GICON.guide}</svg></span><span class="gt"><span class="n">${esc(g.title||t('recTitleDefault'))}</span><span class="m">${esc(pf?pf.name:g.os)} ${esc(g.ver)} · ${g.steps.length} ${esc(t('recSteps'))}</span></span><span class="ga"><button class="play" data-ga="play" title="${esc(t('guidePlayBtn'))}"><svg viewBox="0 0 24 24">${GICON.play}</svg></button><button data-ga="share" title="${esc(t('shareGuideTitle'))}"><svg viewBox="0 0 24 24">${SHARE_SVG}</svg></button><button data-ga="del" title="${esc(t('guideDelete'))}"><svg viewBox="0 0 24 24">${GICON.trash}</svg></button></span></div>`;}).join('')}</div>`:`<div class="auth-sub" style="margin:14px 0">${esc(t('noGuides'))}</div>`;
  const m=el(`<div class="auth-modal"><button class="auth-x">✕</button><div class="auth-h" style="margin-top:2px">${esc(t('myGuides'))}</div><div style="max-height:60vh;overflow:auto;margin-top:12px">${body}</div></div>`);
  o.appendChild(m);
  o.querySelector('.ovl-bg').addEventListener('click',closePanels);
  m.querySelector('.auth-x').addEventListener('click',closePanels);
  m.querySelectorAll('.guide-card').forEach(card=>{
   const id=card.dataset.id;const g=gs.find(x=>x.id===id);
   card.querySelector('[data-ga="play"]').addEventListener('click',()=>{closePanels();playGuide(g);});
   card.querySelector('[data-ga="share"]').addEventListener('click',()=>shareGuideModal(g));
   card.querySelector('[data-ga="del"]').addEventListener('click',()=>{deleteGuide(id);myGuidesModal();});
  });
 }
 /* --- playback engine --- */
 function findRowByChildTitle(detail,title){for(const sec of (detail.sections||[]))for(const r of (sec.rows||[])){if(r.detail&&dt(r.detail.title)===title)return r;}return null;}
 function navGuideTo(path){
  path=path||[];
  const s=SETTINGS[state.platform.id];const f=state.platform.frame;
  state.selectedId=null;state.stack=[];state.filter='';
  if(['mac','win','linux','chromeos','winclassic','macclassic'].includes(f))state.winOpen=true;else state.view='settings';
  let ok=true;
  if(path.length){
   const cat=osSidebar(s).find(i=>i.detail&&dt(i.title)===path[0]);
   if(!cat){ok=false;}
   else{state.selectedId=cat.id;state.stack=[cat.detail];
    for(let k=1;k<path.length&&ok;k++){const top=state.stack[state.stack.length-1];const r=findRowByChildTitle(top,path[k]);if(!r||!r.detail){ok=false;}else state.stack.push(r.detail);}
   }
  }
  renderDevice();
  return ok;
 }
 function highlightRow(label){
  document.querySelectorAll('.guide-hl').forEach(x=>x.classList.remove('guide-hl'));
  const root=document.querySelector('.settings')||document.body;
  const row=[...root.querySelectorAll('.row, .side-row')].find(r=>{const l=r.querySelector('.row-label');return l&&l.textContent.trim()===label;});
  if(row){row.classList.add('guide-hl');try{row.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){}}
  return row;
 }
 function playGuide(g){
  if(!g||!g.os||!Array.isArray(g.steps)||!g.steps.length)return;
  const pf=PLATFORMS.find(p=>p.id===g.os&&p.available);if(!pf)return;
  PLAY={guide:g,i:-1};
  boot(g.os,pf.versions.indexOf(g.ver)>=0?g.ver:pf.versions[0]);
  state.deviceLang=g.lang||state.lang;
  playStartCard(g);
 }
 function playStartCard(g){
  closePanels();
  const pf=PLATFORMS.find(p=>p.id===g.os);
  const o=el('<div class="ovl show auth-ovl"><div class="ovl-bg"></div></div>');document.body.appendChild(o);
  o.appendChild(el(`<div class="auth-modal guide-hero"><div class="gmk"><svg viewBox="0 0 24 24">${GICON.play}</svg></div><div class="auth-h">${esc(g.title||t('recTitleDefault'))}</div><div class="guide-meta">${esc(pf?pf.name:g.os)} ${esc(g.ver)} · ${g.steps.length} ${esc(t('recSteps'))}${g.by?' · '+esc(g.by):''}</div><div class="auth-sub" style="margin-top:8px">${esc(t('guideIntro'))}</div><button class="auth-submit gstart" style="margin-top:6px">${esc(t('guideStartBtn'))}</button><div class="auth-switch"><b class="gexit">${esc(t('guideExit'))}</b></div></div>`));
  o.querySelector('.ovl-bg').addEventListener('click',()=>{closePanels();clearPlay();});
  o.querySelector('.gstart').addEventListener('click',()=>{closePanels();gotoStep(0);});
  o.querySelector('.gexit').addEventListener('click',()=>{closePanels();clearPlay();});
 }
 function gotoStep(i){
  if(!PLAY)return;const g=PLAY.guide;
  if(i<0)i=0;if(i>=g.steps.length){guideDoneCard();return;}
  PLAY.i=i;const st=g.steps[i];
  const ok=navGuideTo(st.path);
  requestAnimationFrame(()=>{const row=ok?highlightRow(st.label):null;renderCoach(st,i,g.steps.length,ok&&!!row);});
 }
 function renderCoach(st,i,total,found){
  document.querySelectorAll('.coach').forEach(c=>c.remove());
  const kw=kindWord(st.kind);
  const note=(st.note&&st.note.trim())?st.note:(kw+' — '+st.label);
  const prog=Array.from({length:total},(_,k)=>`<span class="${k<i?'done':(k===i?'cur':'')}"></span>`).join('');
  const c=el(`<div class="coach"><div class="coach-top"><span class="coach-step">${esc(t('stepLabel'))} ${i+1} ${esc(t('ofLabel'))} ${total}</span><button class="coach-x">✕</button></div><div class="coach-note">${esc(note)}</div><div class="coach-target">${found?esc(kw)+': <b>'+esc(st.label)+'</b>':'<b style=color:#ff8a80>'+esc(t('guideNavFail'))+'</b>'}</div><div class="coach-prog">${prog}</div><div class="coach-btns"><button class="coach-prev"${i===0?' disabled style="opacity:.4"':''}>${esc(t('guidePrev'))}</button><button class="coach-next">${i===total-1?esc(t('recFinish')):esc(t('guideNext'))}</button></div></div>`);
  document.body.appendChild(c);
  c.querySelector('.coach-x').addEventListener('click',clearPlay);
  c.querySelector('.coach-prev').addEventListener('click',()=>{if(i>0)gotoStep(i-1);});
  c.querySelector('.coach-next').addEventListener('click',()=>{if(i===total-1)guideDoneCard();else gotoStep(i+1);});
 }
 function guideDoneCard(){
  const g=PLAY?PLAY.guide:null;
  document.querySelectorAll('.coach').forEach(c=>c.remove());document.querySelectorAll('.guide-hl').forEach(x=>x.classList.remove('guide-hl'));
  const o=el('<div class="ovl show auth-ovl"><div class="ovl-bg"></div></div>');document.body.appendChild(o);
  o.appendChild(el(`<div class="auth-modal guide-hero"><div class="gmk"><svg viewBox="0 0 24 24">${GICON.check}</svg></div><div class="auth-h">${esc(t('guideDoneTitle'))}</div><div class="auth-sub" style="margin-top:6px">${esc(t('guideDoneSub'))}</div><button class="auth-submit greplay" style="margin-top:4px">${esc(t('guideReplay'))}</button><button class="soc-btn gshare" style="margin-top:10px"><svg viewBox="0 0 24 24">${SHARE_SVG}</svg>${esc(t('shareGuideTitle'))}</button><div class="auth-switch"><b class="gclose">${esc(t('guideExit'))}</b></div></div>`));
  o.querySelector('.ovl-bg').addEventListener('click',()=>{closePanels();PLAY=null;});
  o.querySelector('.greplay').addEventListener('click',()=>{closePanels();if(g)playGuide(g);});
  o.querySelector('.gshare').addEventListener('click',()=>{if(g)shareGuideModal(g);});
  o.querySelector('.gclose').addEventListener('click',()=>{closePanels();PLAY=null;});
 }
 function clearPlay(){document.querySelectorAll('.coach').forEach(c=>c.remove());document.querySelectorAll('.guide-hl').forEach(x=>x.classList.remove('guide-hl'));PLAY=null;}
 function parseHash(h){
  h=h||location.hash||'';
  if(h.indexOf('#g=')===0){try{const g=JSON.parse(b64d(decodeURIComponent(h.slice(3))));playGuide(g);return true;}catch(e){return false;}}
  if(h.indexOf('#/')===0){const seg=h.slice(2).split('/').map(x=>{try{return decodeURIComponent(x);}catch(e){return x;}}).filter(Boolean);if(seg.length>=2){const pf=PLATFORMS.find(p=>p.id===seg[0]&&p.available);if(pf){boot(pf.id,pf.versions.indexOf(seg[1])>=0?seg[1]:pf.versions[0]);if(seg[2])setTimeout(()=>openCategory(seg[2]),80);return true;}}}
  return false;
 }

 window.addEventListener('resize',()=>{if(state.view!=='select'){if(state.autoFit)fit();else applyZoom();}});
 if(USER&&USER.prefs&&USER.prefs.lang)state.lang=USER.prefs.lang;
 initTheme();
 renderSelect();
 buildFAB();
 maybeCookie();
 parseHash();
})();
</script>
