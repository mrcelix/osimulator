<style>
:root{
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --ios-blue:#007aff;--ios-green:#34c759;--sep:rgba(60,60,67,.20);
  --group-bg:#f2f2f7;--card:#fff;--label2:rgba(60,60,67,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--sf);background:#0b0b0f;color:#1c1c1e;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ===== SELECTION ===== */
.select-screen{height:100vh;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:7vh 20px 40px;text-align:center;background:radial-gradient(120% 90% at 50% 0%,#1c1c2b 0%,#0b0b0f 60%);color:#f5f5f7}
.sel-head h1{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.brand{font-size:52px;font-weight:800;letter-spacing:-.03em;margin:0;color:#f5f5f7;line-height:1}
.brand-s{display:inline-block;color:#fff;background:linear-gradient(135deg,#0a84ff,#5e5ce6);border-radius:12px;padding:0 .16em;margin:0 .04em;box-shadow:0 6px 20px rgba(10,132,255,.45);transform:translateY(.02em)}
.brand-sub{font-size:13px;font-weight:700;letter-spacing:.42em;color:#8e8e9a;margin:12px 0 14px;padding-left:.42em}
.sel-head p{max-width:620px;margin:6px auto 0;color:#a1a1aa;font-size:17px;line-height:1.5}
.sel-grid{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin:46px 0 30px}
.sel-card{width:260px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:28px 22px;backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;transition:transform .2s,border-color .2s}
.sel-card:not(.disabled):hover{transform:translateY(-4px);border-color:rgba(255,255,255,.2)}
.sel-card.disabled{opacity:.5}
.sel-logo{width:92px;height:92px;border-radius:22px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative}
.sel-logo::after{content:"";position:absolute;inset:0;border-radius:22px;border:1.5px solid rgba(255,255,255,.14)}
.sel-logo svg{width:52px;height:52px}
.sel-name{font-size:22px;font-weight:700}
.sel-tag{color:#9a9aa2;font-size:14px;margin-top:2px}
.sel-versions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.ver-chip{padding:8px 16px;border-radius:100px;background:var(--ios-blue);color:#fff;font-size:15px;font-weight:600;transition:filter .15s}
.ver-chip:hover{filter:brightness(1.12)}
.sel-soon{margin-top:18px;font-size:14px;color:#8e8e93;border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:100px}
.sel-foot{color:#6b6b73;font-size:13px;margin-top:20px}
.sel-topbar{width:100%;max-width:860px;display:flex;justify-content:flex-end;margin-bottom:8px}
.lang-select{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:5px 10px;color:#e6e6ea}
.lang-select svg{width:16px;height:16px;fill:currentColor;opacity:.85}
.lang-select select{background:transparent;border:none;color:#e6e6ea;font-family:inherit;font-size:14px;outline:none;cursor:pointer}
.lang-select select option{color:#111}
.toolbar .lang-select{background:rgba(255,255,255,.06);padding:4px 8px}
.toolbar .lang-select select{font-size:13px}
.select-screen[dir="rtl"] .sel-topbar{justify-content:flex-start}

/* ===== TOOLBAR (viewer tools) ===== */
.toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#17171c;border-bottom:1px solid rgba(255,255,255,.07);color:#d9d9de;flex:none;z-index:20;flex-wrap:wrap}
.tb-group{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);border-radius:10px;padding:3px}
.tb-btn{min-width:34px;height:32px;padding:0 10px;border-radius:8px;color:#e6e6ea;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.tb-btn.active{background:#0a84ff;color:#fff}
.tb-btn.wide{font-weight:600;font-size:14px}
.tb-title{font-size:14px;color:#9a9aa2;font-weight:600}
.tb-spacer{flex:1}
.tb-zoom{min-width:54px;text-align:center;font-size:13px;color:#b9b9c2;font-variant-numeric:tabular-nums}
.tb-hint{font-size:12px;color:#6b6b73}

/* ===== STAGE / DEVICE ===== */
.stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:26px;background:radial-gradient(120% 120% at 50% 30%,#26263a 0%,#0b0b0f 70%)}
.device-wrap{transform-origin:50% 50%;transition:transform .18s ease}
.device{position:relative;background:#0a0a0a;border-radius:34px;padding:14px;box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 2px #2a2a2e inset,0 0 0 6px #050505;width:1080px;aspect-ratio:1194/834;transition:aspect-ratio .25s,width .25s}
.device.portrait{width:760px;aspect-ratio:834/1194}
.device.device-iphone{width:min(390px,90vw);aspect-ratio:390/844;border-radius:44px}
.device.device-android{width:min(390px,90vw);aspect-ratio:390/850;border-radius:34px}
.device.device-iphone .screen,.device.device-android .screen{border-radius:32px}
.device.device-android .screen{border-radius:22px}
.screen{position:absolute;inset:14px;border-radius:22px;overflow:hidden;background:#000}
.home-indicator{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:32%;max-width:320px;height:5px;border-radius:3px;background:rgba(255,255,255,.65);z-index:5}
.cam{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#0c0c10;box-shadow:0 0 0 2px #1b1b1f;z-index:6}
.device.portrait .cam{top:auto;left:14px;top:50%;transform:translateY(-50%)}

/* ===== macOS WINDOW ===== */
.stage.frame-mac{background:linear-gradient(160deg,#3b2f66 0%,#7b4d9e 45%,#c65f8e 100%)}
.stage.frame-win{background:linear-gradient(160deg,#0a3d62 0%,#1e6fa8 55%,#3a9bd6 100%)}
.macwin{width:min(1120px,92vw);aspect-ratio:1180/760;background:#e8e8ed;border-radius:12px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.25);display:flex;flex-direction:column}
.mac-titlebar{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;background:#ececf1;border-bottom:1px solid rgba(0,0,0,.08);position:relative}
.tl{width:12px;height:12px;border-radius:50%}
.tl.red{background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.tl.yellow{background:#febc2e}.tl.green{background:#28c840}
.mac-title{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:#3a3a3c;pointer-events:none}
.win-body{flex:1;position:relative;overflow:hidden}

/* ===== WINDOWS WINDOW ===== */
.winwin{width:min(1160px,93vw);aspect-ratio:1200/780;background:#f3f3f3;border-radius:8px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.15);display:flex;flex-direction:column;font-family:"Segoe UI Variable","Segoe UI",var(--sf)}
.win-titlebar{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 0 0 14px;background:#f3f3f3;border-bottom:1px solid rgba(0,0,0,.06)}
.wt-ic{width:16px;height:16px;color:#0067c0}.wt-ic svg{width:16px;height:16px;fill:#0067c0}
.wt-title{font-size:12px;color:#1b1b1b}
.wt-spacer{flex:1}
.wt-btn{width:46px;height:40px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#333;transition:background .12s}
.wt-btn:hover{background:rgba(0,0,0,.06)}
.wt-btn.close:hover{background:#e81123;color:#fff}

/* ===== MONITOR (desktop display bezel) ===== */
.monitor{position:relative;background:#0a0a0a;border-radius:22px;padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 2px #2a2a2e inset,0 0 0 6px #050505;width:min(1200px,94vw);aspect-ratio:16/10}
.monitor .screen{position:absolute;inset:12px;border-radius:12px;overflow:hidden;background:#000}

/* macOS desktop */
.mac-desktop{position:absolute;inset:0;overflow:hidden}
.mac-menubar{position:absolute;top:0;left:0;right:0;height:26px;display:flex;align-items:center;gap:16px;padding:0 12px;background:rgba(255,255,255,.22);backdrop-filter:blur(24px);font-size:13px;color:#1c1c1e;font-weight:500;z-index:5}
.mac-menubar .apple svg{width:15px;height:15px;fill:#1c1c1e;display:block}
.mac-menubar .mb-app{font-weight:700}
.mac-menubar .mb-menus{display:flex;gap:15px;font-weight:400}
.mac-menubar .mb-right{margin-left:auto;display:flex;align-items:center;gap:13px}
.mac-menubar .mb-right svg{width:16px;height:15px;fill:#1c1c1e}
.mac-dock{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:9px;padding:7px 11px;border-radius:22px;background:rgba(255,255,255,.24);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.35);box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:6}
.dock-app{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(0,0,0,.25);transition:transform .16s;position:relative}
.dock-app:hover{transform:translateY(-9px) scale(1.06)}
.dock-app svg{width:33px;height:33px}
.dock-app.run::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:rgba(0,0,0,.5)}
.dock-sep{width:1px;height:44px;background:rgba(0,0,0,.15);margin:0 3px;align-self:center}
.mac-desktop .macwin{width:80%;aspect-ratio:1180/720;position:absolute;left:50%;top:calc(50% + 6px);transform:translate(-50%,-50%);box-shadow:0 30px 70px rgba(0,0,0,.55)}

/* Windows desktop */
.win-desktop{position:absolute;inset:0;overflow:hidden}
.win-icons{position:absolute;top:14px;left:12px;display:flex;flex-direction:column;gap:14px}
.desk-ic{width:66px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.desk-ic .di{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.desk-ic .di svg{width:32px;height:32px}
.win-taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(243,243,243,.82);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.5);z-index:6}
.task-app{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:background .12s;position:relative}
.task-app:hover{background:rgba(0,0,0,.07)}
.task-app svg{width:24px;height:24px}
.task-app.start svg{width:22px;height:22px}
.task-app.run::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:2px;background:#0067c0}
.win-tray{position:absolute;right:8px;bottom:0;height:44px;display:flex;align-items:center;gap:12px;font-size:12px;color:#1b1b1b;padding-right:6px}
.win-tray .tray-ic{display:flex;gap:8px;align-items:center}
.win-tray svg{width:16px;height:16px;fill:#1b1b1b}
.win-tray .clk{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;font-size:11px}
.win-start{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);width:min(620px,84%);max-height:76%;background:rgba(238,238,242,.97);backdrop-filter:blur(34px);border:1px solid rgba(255,255,255,.6);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.42);padding:22px 26px;z-index:7;font-family:"Segoe UI Variable","Segoe UI",var(--sf)}
.start-search{height:34px;border-radius:18px;background:#fbfbfb;border:1px solid #e2e2e2;display:flex;align-items:center;gap:8px;padding:0 14px;color:#777;font-size:13px}
.start-search svg{width:15px;height:15px;fill:#777}
.start-lbl{font-size:13px;font-weight:600;color:#1b1b1b;margin:16px 2px 10px}
.start-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 6px}
.start-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:7px;font-size:11px;color:#1b1b1b;text-align:center;transition:background .12s}
.start-tile:hover{background:rgba(0,0,0,.06)}
.start-tile .st-ic{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.start-tile .st-ic svg{width:22px;height:22px}
.start-foot{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(0,0,0,.08)}
.start-foot .su{display:flex;align-items:center;gap:9px;font-size:13px;color:#1b1b1b;font-weight:500}
.start-foot .avatar{width:30px;height:30px;font-size:12px}
.start-foot .pw{margin-left:auto}
.win-desktop .winwin{width:82%;aspect-ratio:1200/760;position:absolute;left:50%;top:calc(50% - 8px);transform:translate(-50%,-50%);box-shadow:0 30px 70px rgba(0,0,0,.5)}

/* ===== STATUS BAR ===== */
.statusbar{position:absolute;top:0;left:0;right:0;height:26px;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:14px;font-weight:600;color:#fff}
.settings .statusbar{color:#1c1c1e}
.sb-right{display:flex;align-items:center;gap:6px}
.sb-ic{width:17px;height:15px;fill:currentColor}.sb-ic.batt{width:26px}
.sb-batt{font-size:13px;font-weight:600}

/* ===== HOME ===== */
.home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:26px;color:#fff}
.home-clock{margin-top:5vh;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.hc-time{font-size:64px;font-weight:700;letter-spacing:-.02em;line-height:1}
.hc-date{font-size:19px;font-weight:500;margin-top:4px;opacity:.95}
.app-grid{margin-top:auto;margin-bottom:24px;display:grid;grid-template-columns:repeat(6,1fr);gap:24px 38px}
.dock{margin-bottom:28px;display:flex;gap:32px;padding:12px 26px;border-radius:30px;background:rgba(255,255,255,.22);backdrop-filter:blur(28px)}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;width:74px}
.app-ic{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.app-ic svg{width:38px;height:38px}
.app-ic.rich{overflow:hidden}
.app-ic.rich svg{width:100%!important;height:100%!important}
.dock-app.rich{overflow:hidden}
.dock-app.rich svg{width:100%!important;height:100%!important}
.app-label{font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.dock .app-label{display:none}
.app:active .app-ic{transform:scale(.9)}
.toast{position:absolute;left:50%;bottom:12%;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:100px;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== SETTINGS ===== */
.settings{position:absolute;inset:0;background:var(--group-bg)}
.split{position:absolute;inset:26px 0 0;display:flex}
.sidebar{width:320px;flex:none;background:#efeff4;border-right:1px solid var(--sep);display:flex;flex-direction:column}
.device.portrait .sidebar{width:44%}
.side-top{padding:14px 18px 4px}
.settings-home{font-size:26px;font-weight:700;letter-spacing:-.02em;color:#000}
.search{margin:6px 14px 8px;height:34px;border-radius:10px;background:rgba(118,118,128,.12);display:flex;align-items:center;gap:6px;padding:0 8px;color:#8e8e93;font-size:16px}
.search svg{width:17px;height:17px;flex:none}
.search input{border:none;background:none;outline:none;flex:1;font-size:16px;color:#000;font-family:inherit}
.side-list{flex:1;overflow-y:auto;padding:4px 8px 20px}
.side-gap{height:18px}
.side-row{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left;font-size:16px;color:#000}
.side-row.active{background:rgba(120,120,128,.18)}
.side-row:not(.active):hover{background:rgba(120,120,128,.08)}
.side-row.hide{display:none}
.account-row{padding:10px;margin-bottom:4px}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#a1a1aa,#6b6b73);color:#fff;font-weight:600;font-size:17px}
.avatar.lg{width:66px;height:66px;font-size:25px}
.acc-text{display:flex;flex-direction:column;flex:1;min-width:0}
.acc-name{font-size:19px;font-weight:600}
.acc-sub{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-label{flex:1;min-width:0}
.row-right,.row-r{display:flex;align-items:center;gap:6px;margin-left:auto}
.row-val{color:var(--label2);font-size:15px}
.chev{width:15px;height:15px;flex:none}
.reddot{min-width:20px;height:20px;padding:0 5px;border-radius:100px;background:#ff3b30;color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.ic{width:29px;height:29px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center}
.ic svg{width:21px;height:21px}
/* filled icon rendering — glyphs inherit currentColor; color set per context */
.ic svg,.app-ic svg,.dock-app svg,.task-app svg,.st-ic svg,.sb-ic,.sl-ic,.desk-ic .di svg,.mac-menubar .mb-right svg,.win-tray svg,.search svg,.start-search svg,.wt-ic svg{fill:currentColor}
.ic svg,.dock-app svg,.st-ic svg{color:#fff}
.sl-ic{color:#8e8e93}
.mac-menubar .mb-right svg{color:#1c1c1e}
.win-tray svg{color:#1b1b1b}
.search svg{color:#8e8e93}
.start-search svg{color:#777}
.wt-ic svg{color:#0067c0}
.task-app svg,.desk-ic .di svg{color:currentColor}
.task-app.start svg{color:#0067c0}
.ic.big{width:60px;height:60px;border-radius:14px}.ic.big svg{width:40px;height:40px}

/* detail */
.detail{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--group-bg)}
.nav{height:44px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--sep);background:rgba(249,249,249,.92);backdrop-filter:blur(20px)}
.nav-title{font-size:17px;font-weight:600}
.nav-back{position:absolute;left:10px;display:flex;align-items:center;gap:2px;color:var(--ios-blue);font-size:16px;max-width:45%}
.nav-back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-back .chev{width:20px;height:20px;transform:rotate(180deg)}
.nav-back .chev path{stroke:var(--ios-blue)}
.nav-back.hidden{display:none}
.detail-scroll{flex:1;overflow-y:auto;padding:8px 0 40px}
.big-title{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:8px 20px 14px}
.section{margin:0 0 26px}
.sec-header{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:0 20px 7px}
.sec-footer{font-size:13px;color:var(--label2);padding:7px 20px 0;line-height:1.45}
.sec-card{background:var(--card);margin:0 16px;border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;border-bottom:1px solid var(--sep);font-size:17px;width:100%;text-align:left;background:none}
.row:last-child{border-bottom:none}
.row-l{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.row.tappable:active{background:rgba(120,120,128,.12)}
.row.dead{cursor:default}
.tgl{width:51px;height:31px;border-radius:100px;background:rgba(120,120,128,.32);position:relative;flex:none;transition:background .25s;display:inline-block}
.tgl.on{background:var(--ios-green)}
.knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:left .25s}
.tgl.on .knob{left:22px}
.check-row .tickmark{width:20px;height:20px;color:var(--ios-blue);opacity:0}
.check-row.sel .tickmark{opacity:1}
.swatch{width:26px;height:26px;border-radius:7px;border:1px solid var(--sep)}
.swatch.light{background:#fff}.swatch.dark{background:#1c1c1e}
.tick{color:var(--ios-green);font-size:14px;font-weight:500}
.slider-row{gap:14px}
.sl-ic{width:18px;height:18px;flex:none}.sl-ic.big{width:24px;height:24px}
.slider{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:rgba(120,120,128,.3)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
.btn-row{color:var(--ios-blue);font-size:17px}
.btn-row.center{justify-content:center}
.btn-row.danger{color:#ff3b30}
.note{color:var(--label2);font-size:15px}
.storage{flex-direction:column;align-items:stretch;gap:10px}
.storage-bar{height:12px;border-radius:6px;overflow:hidden;display:flex;background:rgba(120,120,128,.2)}
.storage-bar span{height:100%}
.storage-key{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--label2)}
.storage-key i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}
.wp-row{gap:16px}
.wp-thumb{flex:1;aspect-ratio:3/4;border-radius:12px;position:relative;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.wp-thumb span{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.acc-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 4px}
.acc-hero .n{font-size:22px;font-weight:700}
.acc-hero .e{font-size:14px;color:var(--label2)}
/* ===== DESKTOP SETTINGS THEMES ===== */
.os-macos .split,.os-windows .split{inset:0}
.os-macos .settings,.os-windows .settings{background:transparent}
/* macOS */
.os-macos .sidebar{width:250px;background:rgba(236,236,241,.7);backdrop-filter:blur(14px);border-right:1px solid rgba(0,0,0,.06)}
.os-macos .settings-home{font-size:14px;font-weight:600}
.os-macos .side-row{font-size:14px;padding:6px 9px}
.os-macos .ic{width:24px;height:24px;border-radius:6px}.os-macos .ic svg{width:17px;height:17px}
.os-macos .avatar{width:38px;height:38px;font-size:15px}
.os-macos .acc-name{font-size:15px}
.os-macos .tgl.on{background:#0a84ff}
.os-macos .detail{background:#f2f2f7}
.os-macos .nav{background:transparent;border-bottom:1px solid rgba(0,0,0,.06);justify-content:flex-start;padding-left:14px}

/* Windows 11 */
.os-windows .sidebar{width:300px;background:#f3f3f3;border-right:none;padding-top:2px}
.os-windows .settings-home{font-size:15px;font-weight:600;color:#1b1b1b}
.os-windows .search{background:#fbfbfb;border:1px solid #e4e4e4;border-radius:5px;height:32px}
.os-windows .search input{font-size:13px}
.os-windows .side-row{border-radius:5px;font-size:14px;padding:9px 10px;color:#1b1b1b;position:relative}
.os-windows .side-row.active{background:rgba(0,103,192,.10)}
.os-windows .side-row.active::before{content:"";position:absolute;left:1px;top:8px;bottom:8px;width:3px;border-radius:2px;background:#0067c0}
.os-windows .ic{border-radius:6px;width:26px;height:26px}.os-windows .ic svg{width:18px;height:18px}
.os-windows .side-gap{height:10px}
.os-windows .detail{background:#f3f3f3}
.os-windows .nav{background:#f3f3f3;border-bottom:1px solid rgba(0,0,0,.05);justify-content:flex-start;padding-left:22px;height:42px}
.os-windows .nav-title{display:none}
.os-windows .nav-back{color:#1b1b1b}.os-windows .nav-back .chev path{stroke:#1b1b1b}
.os-windows .big-title{font-size:21px;font-weight:600;margin:16px 24px 14px;color:#1b1b1b}
.os-windows .sec-header{font-size:13px;font-weight:600;color:#1b1b1b;text-transform:none;letter-spacing:0;padding:0 24px 7px}
.os-windows .sec-footer{padding-left:24px}
.os-windows .sec-card{background:#fbfbfb;border:1px solid rgba(0,0,0,.055);border-radius:8px;margin:0 24px}
.os-windows .row{font-size:14px;min-height:50px}
.os-windows .row-label{font-size:14px}
.os-windows .row-val{font-size:13px}
.os-windows .chev path{stroke:#7a7a7a}
.os-windows .tgl{width:40px;height:20px;background:#868686}
.os-windows .tgl .knob{width:12px;height:12px;top:4px;left:5px}
.os-windows .tgl.on{background:#0067c0}.os-windows .tgl.on .knob{left:23px}
.os-windows .btn-row{color:#0067c0}

/* ===== PHONE (iOS / Android) ===== */
.phone-home{padding-top:26px}
.phone-home .home-clock{margin-top:9vh}
.phone-home .hc-time{font-size:54px}
.app-grid.phone{grid-template-columns:repeat(4,1fr);gap:22px 14px;margin-top:auto;margin-bottom:18px;padding:0 20px}
.phone-home .app-ic{width:52px;height:52px;border-radius:12px}
.phone-home .app-ic svg{width:32px;height:32px}
.phone-home .dock{margin-bottom:20px;gap:18px;padding:12px 20px}
.pixel-search{margin:auto 22px 14px;height:46px;border-radius:24px;background:rgba(255,255,255,.92);display:flex;align-items:center;gap:12px;padding:0 18px;color:#5f6368;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.pixel-search svg{width:21px;height:21px;fill:none;stroke:#5f6368;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.settings.phone{position:absolute;inset:0;background:var(--group-bg);display:flex;flex-direction:column}
.settings.phone .phone-topbar{margin-top:26px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--sep);background:rgba(249,249,249,.92);backdrop-filter:blur(20px)}
.ph-title{font-size:17px;font-weight:600;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.ph-back{position:absolute;left:6px;display:flex;align-items:center;gap:1px;color:var(--ios-blue);font-size:16px;max-width:32%}
.ph-back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-back .chev{width:22px;height:22px;transform:rotate(180deg)}
.ph-back .chev path{stroke:var(--ios-blue)}
.ph-back.hidden{display:none}
.phone-scroll{flex:1;overflow-y:auto;padding:4px 0 34px}
.settings.phone .sec-card{margin:0 16px}
.settings.phone .big-title{font-size:32px;margin:6px 18px 14px}
.acc-row2{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.acc-row2 .avatar{width:52px;height:52px;font-size:19px}
/* phone home widgets */
.ios-toptime{margin-top:5vh;text-align:center;color:#fff;font-size:15px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.35);line-height:1.35}
.ios-toptime span{font-weight:400;opacity:.92}
.ios-widgets{display:flex;gap:16px;padding:0 22px;margin:16px 0 auto}
.ios-widget{flex:1;aspect-ratio:1;background:rgba(255,255,255,.2);backdrop-filter:blur(24px);border-radius:22px;padding:13px 15px;color:#fff;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.ios-widget .w-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.ios-widget .w-top svg{width:24px;height:24px}
.ios-widget .w-temp{font-size:38px;font-weight:300;line-height:1.1;margin-top:2px}
.ios-widget .w-sub{font-size:12px;opacity:.92}
.ios-widget .w-hl{font-size:12px;margin-top:auto;opacity:.92}
.ios-widget.cal{background:rgba(255,255,255,.92);color:#1c1c1e}
.ios-widget.cal .w-cal-day{color:#ff3b30;font-size:13px;font-weight:700;letter-spacing:.02em}
.ios-widget.cal .w-cal-date{font-size:40px;font-weight:600;line-height:1}
.ios-widget.cal .w-cal-ev{font-size:11.5px;color:#3a3a3c;margin-top:auto;line-height:1.7}
.dotb,.dotg{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.dotb{background:#0a84ff}.dotg{background:#34c759}
.at-glance{display:flex;align-items:center;gap:8px;justify-content:center;color:#fff;font-size:14px;margin-top:8px;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.at-glance svg{width:18px;height:18px}
.phone-home.android .home-clock{margin-top:7vh}
.phone-home.android .hc-time{font-size:60px;font-weight:500;letter-spacing:-.01em}
.pixel-search .px-mic{margin-left:auto}
.pixel-search .px-mic svg{width:20px;height:20px}
.pixel-search svg{width:21px;height:21px}
.ios-widget svg,.at-glance svg,.pixel-search svg,.pixel-search .px-mic svg{fill:currentColor}

/* Android (Material) theme */
.os-android{font-family:'Roboto','Segoe UI',var(--sf);--group-bg:#f8f9fd}
.os-android .phone-topbar{background:#f8f9fd;border-bottom:none}

.os-android .and-search svg{width:22px;height:22px;fill:none;stroke:#5f6368;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.os-android .sec-header{color:#1a73e8;font-weight:600;text-transform:none;letter-spacing:0;padding:10px 22px 6px;font-size:14px}
.os-android .sec-footer{padding-left:22px}
.os-android .row{min-height:58px;font-size:16px}
.os-android .ic{border-radius:50%}
.os-android .row-label{font-weight:400}
.os-android .chev path{stroke:#9aa0a6}

@media(max-width:720px){.hc-time{font-size:48px}.app-grid{gap:16px 20px}}
/* ===== FAB + PANELS ===== */
#fab{position:fixed;left:22px;right:auto;bottom:22px;z-index:100;display:flex;flex-direction:column;align-items:flex-start;gap:9px;font-family:var(--sf)}
.fab-menu{display:flex;flex-direction:column;align-items:flex-start;gap:10px;opacity:0;transform:translateY(12px) scale(.96);pointer-events:none;transition:opacity .2s,transform .2s}
#fab.open .fab-menu{opacity:1;transform:none;pointer-events:auto}
.fab-item{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px 0 14px;border-radius:22px;background:rgba(28,28,34,.92);color:#f2f2f5;border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 24px rgba(0,0,0,.4);backdrop-filter:blur(16px);font-size:14px;font-weight:600;transition:transform .15s,background .15s}
.fab-item:hover{transform:translateX(3px);background:rgba(40,40,48,.96)}
.fab-item .fi{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.fab-item .fi svg{width:17px;height:17px;fill:#fff}
.fab-main{width:36px;height:36px;border-radius:50%;background:linear-gradient(150deg,#0a84ff,#5e5ce6);color:#fff;box-shadow:0 7px 22px rgba(10,132,255,.55);display:flex;align-items:center;justify-content:center;transition:transform .25s;position:relative;overflow:hidden}
.fab-main svg{width:19px;height:19px;fill:#fff;transition:transform .25s}
.fab-main .fab-init{font-weight:800;font-size:15px;line-height:1}
.fab-main::after{content:"";position:absolute;top:-60%;left:-30%;width:40%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(20deg);animation:fabShine 4.5s ease-in-out infinite}
@keyframes fabShine{0%,72%{left:-40%}86%{left:130%}100%{left:130%}}
#fab.open .fab-main{transform:rotate(135deg)}
.fab-badge{position:absolute;top:-2px;right:-2px;min-width:14px;height:14px;border-radius:9px;background:#ff3b30;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid #0b0b0f}

.ovl{position:fixed;inset:0;z-index:110;display:none;align-items:flex-end;justify-content:flex-end;padding:20px}
.ovl.show{display:flex}
.ovl-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px)}
.sheet{position:relative;width:min(420px,94vw);max-height:min(680px,88vh);background:#15151b;border:1px solid rgba(255,255,255,.1);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;color:#ececf0;animation:sheetIn .24s ease}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.sheet-hd .sh-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.sheet-hd .sh-ic svg{width:19px;height:19px;fill:#fff}
.sheet-hd h3{font-size:16px;font-weight:700;margin:0;flex:1}
.sheet-hd .sub{font-size:12px;color:#9a9aa6;font-weight:400}
.sheet-x{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);color:#c8c8d0;display:flex;align-items:center;justify-content:center;font-size:16px}
.sheet-x:hover{background:rgba(255,255,255,.15)}
.sheet-body{padding:16px;overflow-y:auto}

/* OS AI chat */
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 13px;border-radius:15px;font-size:14px;line-height:1.5}
.msg.ai{align-self:flex-start;background:#26262f;border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:linear-gradient(150deg,#0a84ff,#3f6fd6);color:#fff;border-bottom-right-radius:5px}
.msg .act{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 11px;border-radius:100px;background:rgba(10,132,255,.18);color:#5cadff;font-size:12px;font-weight:600;border:1px solid rgba(10,132,255,.35)}
.msg .act:hover{background:rgba(10,132,255,.28)}
.chat-sugs{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 10px}
.chat-sug{padding:7px 12px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#cfcfd6;font-size:12.5px}
.chat-sug:hover{background:rgba(255,255,255,.12)}
.chat-input{display:flex;gap:8px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);flex:none}
.chat-input input{flex:1;height:40px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;padding:0 15px;font-size:14px;outline:none;font-family:inherit}
.chat-send{width:40px;height:40px;border-radius:50%;background:#0a84ff;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.chat-send svg{width:20px;height:20px;fill:#fff}
.ai-disclaim{font-size:11px;color:#71717e;text-align:center;padding:0 14px 10px}

/* Feedback */
.fb-stars{display:flex;gap:6px;justify-content:center;margin:4px 0 16px}
.fb-star{font-size:32px;color:#3a3a44;cursor:pointer;transition:color .12s,transform .12s;line-height:1}
.fb-star.on,.fb-star:hover{color:#ffcc00}
.fb-star:hover{transform:scale(1.12)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:#9a9aa6;margin-bottom:6px;font-weight:600}
.fld input,.fld textarea,.fld select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:11px;color:#fff;padding:11px 13px;font-size:14px;font-family:inherit;outline:none}
.fld textarea{min-height:90px;resize:vertical}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#cfcfd6;font-size:13px}
.chip.on{background:#0a84ff;border-color:#0a84ff;color:#fff}
.btn-primary{width:100%;height:46px;border-radius:12px;background:linear-gradient(150deg,#0a84ff,#5e5ce6);color:#fff;font-size:15px;font-weight:700;margin-top:4px}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{width:100%;height:44px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#e6e6ec;font-size:14px;font-weight:600}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.fb-done{text-align:center;padding:24px 8px}
.fb-done .big{font-size:44px}
.fb-done h4{margin:10px 0 4px;font-size:18px}
.fb-done p{color:#9a9aa6;font-size:14px;margin:0}

/* Account / Auth */
.auth-tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);border-radius:12px;padding:4px;margin-bottom:16px}
.auth-tab{flex:1;height:36px;border-radius:9px;color:#b9b9c2;font-size:14px;font-weight:600}
.auth-tab.on{background:rgba(255,255,255,.12);color:#fff}
.gbtn{width:100%;height:46px;border-radius:12px;background:#fff;color:#1f1f1f;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.gbtn:hover{background:#f2f2f2}
.gbtn svg{width:20px;height:20px}
.auth-or{display:flex;align-items:center;gap:10px;color:#71717e;font-size:12px;margin:14px 0}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
.acc-hero2{display:flex;align-items:center;gap:14px;padding:4px 2px 18px}
.acc-hero2 .av{width:56px;height:56px;border-radius:50%;background:linear-gradient(150deg,#0a84ff,#5e5ce6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none}
.acc-hero2 .nm{font-size:18px;font-weight:700}
.acc-hero2 .em{font-size:13px;color:#9a9aa6}
.prov-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#9a9aa6;margin-top:3px;background:rgba(255,255,255,.06);padding:2px 8px;border-radius:100px}
.acc-sec{font-size:12px;color:#8a8a95;text-transform:uppercase;letter-spacing:.03em;margin:16px 0 8px;font-weight:700}
.saved-toast{position:fixed;bottom:96px;right:22px;z-index:130;background:#34c759;color:#fff;padding:11px 18px;border-radius:100px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;font-family:var(--sf)}
.saved-toast.show{opacity:1;transform:none}
@media(max-width:520px){.ovl{padding:0}.sheet{width:100vw;max-height:92vh;border-radius:20px 20px 0 0}.ovl{align-items:flex-end;justify-content:center}}

/* ===== iPhone notch vs Dynamic Island ===== */
.device-iphone.has-notch .cam{top:12px;left:50%;transform:translateX(-50%);width:44%;height:26px;border-radius:0 0 18px 18px;background:#050506;box-shadow:none}
.device-iphone.has-island .cam{top:13px;left:50%;transform:translateX(-50%);width:34%;height:30px;border-radius:16px;background:#050506;box-shadow:none}

/* ===== Windows 10 shell ===== */
.win-desktop.win10 .win-icons .desk-ic{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.win-taskbar.win10{justify-content:flex-start;gap:0;background:rgba(24,26,33,.94);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);padding:0}
.win-taskbar.win10 .task-app{border-radius:0;height:44px;width:44px}
.win-taskbar.win10 .task-app:hover{background:rgba(255,255,255,.12)}
.win-taskbar.win10 .task-app.start{width:48px}
.win-taskbar.win10 .task-app.run::after{background:#4aa3e0;width:100%;height:2px;bottom:0;border-radius:0}
.w10-tbsearch{height:44px;width:230px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(255,255,255,.92);color:#444;font-size:12px}
.w10-tbsearch svg{width:16px;height:16px;fill:#444}
.win-tray.win10{color:#eaeaea;gap:14px}
.win-tray.win10 svg{width:16px;height:16px;fill:#eaeaea}
.win-tray.win10 .clk{color:#eaeaea}
.win-tray.win10 .tray-ac{width:18px;height:18px}
.win-start.win10{left:0;right:auto;transform:none;bottom:44px;width:min(560px,92%);height:min(560px,72%);max-height:72%;border-radius:0;padding:0;background:rgba(28,30,38,.98);color:#fff;display:flex;overflow:hidden;box-shadow:0 -2px 40px rgba(0,0,0,.5)}
.w10-rail{width:48px;flex:none;background:rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
.w10-rail .w10-rspace{flex:1}
.w10-rb{width:40px;height:40px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#eaeaea}
.w10-rb:hover{background:rgba(255,255,255,.12)}
.w10-rb svg{width:20px;height:20px;fill:currentColor}
.avatar.sm{width:26px;height:26px;font-size:11px}
.w10-applist{width:210px;flex:none;overflow-y:auto;padding:8px 4px}
.w10-alh{font-size:11px;color:#c9c9d0;padding:8px 12px 4px;font-weight:600}
.w10-arow{display:flex;align-items:center;gap:12px;width:100%;padding:7px 12px;border-radius:3px;font-size:13px;color:#eaeaea;text-align:left}
.w10-arow:hover{background:rgba(255,255,255,.1)}
.w10-adot{width:26px;height:26px;border-radius:4px;background:#3a5a8a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.w10-tiles{flex:1;padding:14px 16px;overflow-y:auto}
.w10-tgh{font-size:12px;color:#eaeaea;font-weight:600;margin:2px 2px 10px}
.w10-tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.w10-tile2{position:relative;aspect-ratio:1/1;border-radius:2px;display:flex;align-items:center;justify-content:center;color:#fff}
.w10-tile2.wide{grid-column:span 2;aspect-ratio:2/1}
.w10-tile2 svg{width:30px;height:30px}
.w10-tile2 span{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:500}
.winwin.win10{border-radius:0}
.win-titlebar.win10{background:#fff;border-bottom:1px solid #e6e6e6}
/* Windows 10 Settings tile grid */
.w10-settings{padding:34px 40px;height:100%;overflow-y:auto;background:#fff}
.w10-hd{font-size:22px;font-weight:400;color:#1b1b1b;text-align:center;margin-bottom:16px}
.w10-shsearch{max-width:560px;margin:0 auto 26px;height:38px;border:1px solid #d8d8d8;display:flex;align-items:center;gap:8px;padding:0 12px}
.w10-shsearch svg{width:16px;height:16px;fill:#888}
.w10-shsearch input{border:0;outline:0;flex:1;font-size:13px;background:transparent}
.w10-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 28px;max-width:820px;margin:0 auto}
.w10-tile{display:flex;align-items:center;gap:16px;padding:16px 10px;border-radius:2px;text-align:left;transition:background .12s}
.w10-tile:hover{background:#f2f6fb}
.w10-tile:hover .w10-tn{color:#0067c0;text-decoration:underline}
.w10-ic{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}
.w10-ic svg{width:30px;height:30px;fill:#0067c0;color:#0067c0}
.w10-tn{font-size:14px;color:#1b1b1b}
.w10-cat{height:100%;display:flex;flex-direction:column;background:#fff}
.w10-catbar{display:flex;align-items:center;gap:12px;padding:20px 28px 10px}
.w10-back{display:flex;align-items:center;gap:4px;color:#1b1b1b;font-size:13px}
.w10-back svg{width:22px;height:22px;fill:#1b1b1b}
.w10-cattitle{font-size:20px;font-weight:600;color:#1b1b1b}
.w10-catbody{flex:1;overflow-y:auto;padding:8px 28px 28px}
.win-desktop.win10 .winwin{border-radius:0}

/* ===== landing page enhancements ===== */
.sel-stats{display:flex;gap:8px 22px;flex-wrap:wrap;justify-content:center;margin:18px auto 0;color:#9a9aa6;font-size:13px}
.sel-stats span{display:inline-flex;align-items:center;gap:6px}
.sel-stats b{color:#f5f5f7;font-weight:700;font-size:15px}
.sel-stats .ok{color:#30d158;font-weight:600}
.sel-stats .ok::before{content:"●";font-size:9px}
.sel-controls{display:flex;flex-direction:column;align-items:center;gap:14px;margin:34px auto 0;width:100%;max-width:560px}
.sel-search{width:100%;height:46px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;padding:0 16px;transition:border-color .15s,background .15s}
.sel-search:focus-within{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.1)}
.sel-search svg{width:18px;height:18px;fill:#8e8e9a}
.sel-search input{flex:1;background:transparent;border:0;outline:0;color:#f5f5f7;font-size:15px;font-family:var(--sf)}
.sel-search input::placeholder{color:#7a7a86}
.sel-filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.filter-chip{padding:7px 16px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#c7c7cf;font-size:13px;font-weight:600;transition:.15s}
.filter-chip:hover{background:rgba(255,255,255,.12)}
.filter-chip.on{background:#f5f5f7;color:#111;border-color:#f5f5f7}
.sel-grid{margin-top:30px}
.sel-card{position:relative}
.sel-card.hide{display:none}
.sel-card:not(.disabled):hover{transform:translateY(-6px);border-color:var(--accent,#0a84ff);box-shadow:0 26px 54px -24px var(--accent,#0a84ff)}
.sel-badge{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#a9a9b4;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);padding:3px 9px;border-radius:100px}
.select-screen[dir="rtl"] .sel-badge{right:auto;left:14px}
.sel-logo{cursor:pointer;transition:transform .2s}
.sel-logo:hover{transform:scale(1.06)}
.sel-versions{margin-top:16px}
.ver-chip{position:relative;display:inline-flex;align-items:center;gap:6px}
.ver-chip.latest{background:var(--accent,#0a84ff)}
.ver-chip:not(.latest){background:rgba(255,255,255,.1);color:#e6e6ea}
.ver-chip:not(.latest):hover{background:rgba(255,255,255,.18);filter:none}
.ver-chip .lt{font-size:9.5px;font-weight:700;background:rgba(255,255,255,.3);padding:1px 6px;border-radius:100px;text-transform:uppercase;letter-spacing:.03em}
.sel-launch{margin-top:16px;width:100%;padding:11px;border-radius:12px;background:transparent;border:1px solid var(--accent,#0a84ff);color:var(--accent,#0a84ff);font-size:14px;font-weight:700;transition:.15s}
.sel-launch:hover{background:var(--accent,#0a84ff);color:#fff}
.continue-card{display:flex;align-items:center;gap:14px;width:100%;max-width:430px;margin:26px auto 0;padding:13px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-align:left;transition:.15s}
.continue-card:hover{background:rgba(255,255,255,.11);transform:translateY(-2px)}
.cc-logo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.cc-logo svg{width:26px;height:26px}
.cc-text{flex:1;display:flex;flex-direction:column;gap:1px}
.cc-lbl{font-size:12px;color:#9a9aa6}
.cc-os{font-size:16px;font-weight:700;color:#f5f5f7}
.cc-go{font-size:22px;color:#8e8e9a}
.sel-empty{color:#8e8e9a;font-size:15px;margin:20px 0}
.sel-features{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:760px;margin:36px auto 0}
.feat-pill{font-size:12.5px;color:#b8b8c2;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);padding:7px 14px;border-radius:100px}

/* ===== pro landing: sticky nav + hero + sections ===== */
.select-screen{padding:0 0 60px}
.site-nav{position:sticky;top:0;z-index:60;width:100%;background:rgba(11,11,15,.68);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid rgba(255,255,255,.08);transition:box-shadow .25s,background .25s}
.site-nav.scrolled{background:rgba(11,11,15,.9);box-shadow:0 10px 34px -14px rgba(0,0,0,.7)}
.nav-inner{max-width:1140px;margin:0 auto;height:62px;display:flex;align-items:center;gap:18px;padding:0 22px}
.nav-brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;color:#f5f5f7}
.nav-mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 16px rgba(10,132,255,.5)}
.nav-mark i{font-style:normal;opacity:.92}
.nav-word{background:linear-gradient(90deg,#ffffff,#c7c9ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:4px;margin-left:16px}
.nav-link{padding:8px 13px;border-radius:9px;color:#b6b6c2;font-size:14px;font-weight:600;transition:.15s}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.nav-cta{padding:9px 18px;border-radius:10px;background:#f5f5f7;color:#101014;font-size:14px;font-weight:700;transition:.16s;box-shadow:0 6px 18px -8px rgba(255,255,255,.5)}
.nav-cta:hover{transform:translateY(-1px);background:#fff}
.select-screen[dir="rtl"] .nav-right{margin-left:0;margin-right:auto}
.select-screen[dir="rtl"] .nav-links{margin-left:0;margin-right:16px}

.hero{position:relative;width:100%;max-width:920px;margin:0 auto;padding:66px 22px 6px;display:flex;flex-direction:column;align-items:center}
.hero-glow{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:min(680px,90vw);height:360px;background:radial-gradient(closest-side,rgba(94,92,230,.30),rgba(10,132,255,.12),transparent 72%);filter:blur(24px);pointer-events:none;z-index:0;animation:glowPulse 6.5s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.09)}}
.hero>*:not(.hero-glow){position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);color:#cfd0da;font-size:12.5px;font-weight:600;margin-bottom:26px}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 10px #30d158}
.hero-badge b{color:#fff;font-weight:800}
.hero .brand{font-size:clamp(48px,9vw,80px);line-height:.98}
.hero-lead{max-width:610px;margin:20px auto 0;color:#a6a6b4;font-size:clamp(15px,2.3vw,18px);line-height:1.55}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:30px 0 4px}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:13px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:15px;font-weight:700;box-shadow:0 14px 34px -12px rgba(10,132,255,.85);transition:.18s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 22px 46px -12px rgba(10,132,255,.95)}
.btn-ghost{padding:13px 24px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#e9e9ef;font-size:15px;font-weight:700;transition:.18s}
.btn-ghost:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
.hero .sel-stats{margin-top:34px;gap:10px 26px}

.section-head{max-width:1140px;margin:0 auto;padding:0 22px;text-align:center}
.sec-eyebrow{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8b8bff}
.sec-title{font-size:clamp(24px,4vw,33px);font-weight:800;letter-spacing:-.02em;color:#f5f5f7;margin:9px 0 0}
.systems-sec{scroll-margin-top:74px;padding-top:56px;width:100%;display:flex;flex-direction:column;align-items:center}
.how{scroll-margin-top:74px;padding:66px 22px 4px;width:100%}
.how-grid{max-width:980px;margin:38px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.how-step{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:26px 22px;text-align:left;transition:.18s}
.how-step:hover{border-color:rgba(255,255,255,.22);transform:translateY(-3px);background:rgba(255,255,255,.07)}
.select-screen[dir="rtl"] .how-step{text-align:right}
.how-num{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:16px}
.how-step h3{margin:0 0 6px;font-size:17px;font-weight:700;color:#f5f5f7}
.how-step p{margin:0;font-size:14px;line-height:1.5;color:#9c9caa}
.features-sec{scroll-margin-top:74px;padding-top:62px;width:100%}
.features-sec .sel-features{margin-top:26px}
@media(max-width:760px){.nav-links{display:none}.nav-cta{display:none}.how-grid{grid-template-columns:1fr;max-width:420px}.nav-inner{gap:10px}}

.sel-footer{max-width:1140px;margin:66px auto 0;padding:26px 22px 0;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.sel-footer .fbrand{font-weight:800;color:#e6e6ea;font-size:15px;letter-spacing:-.01em}
.sel-footer .fnote{color:#6b6b73;font-size:12.5px;line-height:1.55;max-width:560px}

/* ---- header OS picker ---- */
.os-picker{position:relative}
.os-pick-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 13px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#e6e6ea;font-size:14px;font-weight:600;transition:.15s}
.os-pick-btn:hover{background:rgba(255,255,255,.12)}
.os-pick-btn svg{width:15px;height:15px;fill:currentColor;opacity:.85}
.os-pick-btn .chev{font-size:10px;opacity:.65;transition:transform .2s}
.os-picker.open .os-pick-btn .chev{transform:rotate(180deg)}
.os-pick-menu{position:absolute;top:46px;right:0;width:306px;max-height:64vh;overflow:auto;background:rgba(18,18,24,.98);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.12);border-radius:15px;box-shadow:0 26px 64px -18px rgba(0,0,0,.85);padding:9px;opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:.16s;z-index:90}
.os-picker.open .os-pick-menu{opacity:1;transform:none;pointer-events:auto}
.select-screen[dir="rtl"] .os-pick-menu{right:auto;left:0}
.os-pick-search{width:100%;height:36px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;padding:0 12px;font-size:13px;outline:none;margin-bottom:6px;font-family:inherit}
.os-pick-search:focus{border-color:rgba(255,255,255,.3)}
.os-pick-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:left;color:#e6e6ea;transition:background .12s}
.os-pick-row:hover{background:rgba(255,255,255,.09)}
.os-pick-row.hide{display:none}
.select-screen[dir="rtl"] .os-pick-row{text-align:right}
.os-pick-row .oi{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.os-pick-row .oi svg{width:16px;height:16px;fill:#fff}
.os-pick-row .on{flex:1;font-size:13.5px;font-weight:600}
.os-pick-row .ov{font-size:11px;color:#8e8e9a;background:rgba(255,255,255,.07);padding:2px 8px;border-radius:100px}
.os-pick-empty{padding:16px;text-align:center;color:#8e8e9a;font-size:13px}

/* ---- share button ---- */
.nav-share{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#e6e6ea;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.nav-share:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-share svg{width:17px;height:17px;fill:currentColor}

/* ---- trending chips ---- */
.hero-trend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:26px auto 0;max-width:660px}
.trend-lbl{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:#8b8bff;text-transform:uppercase}
.trend-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#e2e2ea;font-size:13px;font-weight:600;transition:.15s}
.trend-chip:hover{background:rgba(255,255,255,.13);transform:translateY(-1px);border-color:rgba(255,255,255,.28)}
.trend-chip .td{width:17px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex:none}
.trend-chip .td svg{width:11px;height:11px;fill:#fff}

/* ---- SEO footer OS links ---- */
.foot-oslinks{display:flex;flex-wrap:wrap;gap:5px 13px;justify-content:center;max-width:780px;margin:6px auto 2px}
.foot-oslinks a{color:#83838f;font-size:12.5px;font-weight:500;transition:color .12s;cursor:pointer}
.foot-oslinks a:hover{color:#d0d0e0;text-decoration:underline}

/* ---- magic sparkles ---- */
.spark-layer{position:fixed;inset:0;z-index:200;pointer-events:none;overflow:hidden}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#8fd0ff 45%,transparent 72%);opacity:0;animation:sparkFly .9s ease-out forwards}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(.3)}70%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15)}}
.magic-toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);z-index:210;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:0 16px 42px -10px rgba(94,92,230,.75);opacity:0;transition:.32s;display:flex;align-items:center;gap:9px;max-width:82vw}
.magic-toast.show{opacity:1;transform:translateX(-50%)}
.fab-item .fi.magic{background:linear-gradient(135deg,#b14bff,#5e5ce6,#0a84ff)}
@media(max-width:760px){.nav-share{display:none}.os-pick-btn .oplbl{display:none}.os-pick-btn{padding:0 10px}.os-pick-menu{width:min(300px,86vw)}}


/* ===== hero entrance + welcome showcase ===== */
@keyframes heroRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero.enter>*:not(.hero-glow){opacity:0;animation:heroRise .62s cubic-bezier(.2,.7,.2,1) forwards}
.hero.enter>.hero-badge{animation-delay:.05s}
.hero.enter>.brand{animation-delay:.13s}
.hero.enter>.brand-sub{animation-delay:.21s}
.hero.enter>.hero-lead{animation-delay:.29s}
.hero.enter>.hero-cta{animation-delay:.37s}
.hero.enter>.hero-trend{animation-delay:.45s}
.hero.enter>.sel-stats{animation-delay:.53s}
.hero-badge .dot{animation:badgePulse 2.4s ease-in-out infinite}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,.55)}50%{box-shadow:0 0 0 5px rgba(48,209,88,0)}}

/* infinite OS logo marquee */
.os-marquee-wrap{width:100%;margin:38px 0 2px}
.os-marquee-label{text-align:center;font-size:11.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8b8bff;margin-bottom:15px}
.os-marquee{position:relative;width:100%;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.mq-track{display:flex;gap:14px;width:max-content;padding:4px 7px;animation:mqScroll 46s linear infinite;will-change:transform}
.os-marquee:hover .mq-track{animation-play-state:paused}
.mq-item{display:inline-flex;align-items:center;gap:9px;padding:10px 17px;border-radius:100px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#e6e6ec;font-size:13.5px;font-weight:600;white-space:nowrap;transition:transform .15s,background .15s,border-color .15s}
.mq-item:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);transform:translateY(-3px)}
.mq-item .mqi{width:25px;height:25px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.mq-item .mqi svg{width:15px;height:15px;fill:#fff}
@keyframes mqScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.select-screen[dir="rtl"] .mq-track{animation-direction:reverse}

@media (prefers-reduced-motion:reduce){
  .hero.enter>*:not(.hero-glow){opacity:1;animation:none}
  .hero-glow,.hero-badge .dot{animation:none}
  .mq-track{animation:none;flex-wrap:wrap;justify-content:center;width:100%}
  .os-marquee{-webkit-mask-image:none;mask-image:none}
}


/* ===== pro components: theme btn, auth, user menu, tools, newsletter, footer, cookie ===== */
.nav-theme,.nav-auth{height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#e6e6ea;font-weight:600;transition:.15s;display:inline-flex;align-items:center;justify-content:center}
.nav-theme{width:38px}
.nav-theme:hover,.nav-auth:hover{background:rgba(255,255,255,.12)}
.nav-theme svg{width:17px;height:17px;fill:currentColor}
.nav-auth{gap:8px;padding:0 15px;font-size:14px}
.nav-auth.primary{background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;border-color:transparent;box-shadow:0 6px 18px -8px rgba(10,132,255,.8)}
.nav-auth.primary:hover{transform:translateY(-1px)}
.nav-auth svg{width:16px;height:16px;fill:currentColor}
.nav-auth .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.user-wrap{position:relative}
.user-menu{position:absolute;top:48px;right:0;width:236px;background:rgba(18,18,24,.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 24px 60px -18px rgba(0,0,0,.85);padding:8px;z-index:95;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.16s}
.user-wrap.open .user-menu{opacity:1;transform:none;pointer-events:auto}
.select-screen[dir="rtl"] .user-menu{right:auto;left:0}
.um-head{display:flex;gap:10px;align-items:center;padding:8px 8px 12px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.um-head .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.um-nm{font-size:14px;font-weight:700;color:#f2f2f5}.um-em{font-size:12px;color:#9a9aa6}
.um-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;color:#e6e6ea;font-size:13.5px;font-weight:600;text-align:left}
.um-item:hover{background:rgba(255,255,255,.08)}
.um-item svg{width:16px;height:16px;fill:#9a9aa6;flex:none}
.um-sep{height:1px;background:rgba(255,255,255,.08);margin:6px 4px}

.auth-ovl{align-items:center;justify-content:center;padding:20px}
.auth-modal{position:relative;width:min(420px,94vw);max-height:94vh;overflow:auto;background:#16161d;border:1px solid rgba(255,255,255,.1);border-radius:22px;box-shadow:0 40px 100px rgba(0,0,0,.7);padding:24px 26px;color:#ececf0;animation:authIn .28s cubic-bezier(.2,.7,.2,1)}
@keyframes authIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.auth-x{position:absolute;top:15px;right:15px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);color:#c8c8d0;display:flex;align-items:center;justify-content:center;font-size:15px}
.auth-x:hover{background:rgba(255,255,255,.16)}
.auth-logo{display:flex;align-items:center;gap:9px;justify-content:center}
.auth-logo .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.auth-logo b{font-size:18px;letter-spacing:-.01em}
.auth-h{text-align:center;font-size:19px;font-weight:800;margin:10px 0 3px}
.auth-sub{text-align:center;font-size:13px;color:#9a9aa6;margin-bottom:14px;line-height:1.4}
.soc-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:44px;border-radius:12px;background:#fff;color:#1a1a1a;font-size:14px;font-weight:700;margin-bottom:9px;transition:.15s}
.soc-row{display:flex;gap:10px;margin-bottom:4px}
.soc-row .soc-btn{flex:1;margin-bottom:0}
.soc-btn:hover{filter:brightness(.95);transform:translateY(-1px)}
.soc-btn svg{width:19px;height:19px}
.soc-btn.dark{background:#000;color:#fff}.soc-btn.dark svg{fill:#fff}
.auth-or{display:flex;align-items:center;gap:12px;color:#7a7a86;font-size:12px;margin:11px 0}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.12)}
.fld2{margin-bottom:11px}
.fld2 label{display:block;font-size:12.5px;font-weight:600;color:#b6b6c2;margin-bottom:5px}
.fld2 .inp{position:relative}
.fld2 input,.fld2 select{width:100%;height:44px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;padding:0 14px;font-size:14px;outline:none;font-family:inherit;transition:.15s}
.fld2 select option{color:#111}
.fld2 input:focus,.fld2 select:focus{border-color:#0a84ff;background:rgba(255,255,255,.09)}
.fld2 .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#8a8a94;background:none}
.fld2 .eye svg{width:18px;height:18px;fill:currentColor}
.auth-row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 13px;font-size:12.5px}
.auth-check{display:flex;align-items:center;gap:7px;color:#b6b6c2;cursor:pointer}
.auth-check input{width:15px;height:15px;accent-color:#0a84ff}

.auth-submit:hover{transform:translateY(-1px)}
.auth-switch{text-align:center;font-size:13px;color:#9a9aa6;margin-top:13px}
.auth-switch b{color:#5cadff;cursor:pointer;font-weight:700}
.auth-fine{font-size:11px;color:#71717e;text-align:center;margin-top:10px;line-height:1.45}
.acc-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);margin-bottom:16px}
.acc-card .av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.acc-card .nm{font-size:16px;font-weight:700}.acc-card .em{font-size:13px;color:#9a9aa6}
.acc-badge{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;background:rgba(10,132,255,.18);color:#5cadff}

.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px}
.tool-btn{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:#e6e6ea;font-size:12.5px;font-weight:600;transition:.15s}
.tool-btn:hover{background:rgba(255,255,255,.1);transform:translateY(-2px);border-color:rgba(255,255,255,.2)}
.tool-btn .ti{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a84ff,#5e5ce6)}
.tool-btn .ti svg{width:20px;height:20px;fill:#fff}
.sc-list{display:flex;flex-direction:column;gap:8px;padding:4px}
.sc-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05);font-size:13.5px}
.sc-row kbd{font-family:var(--sf);font-size:12px;font-weight:700;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:2px 8px}

.newsletter{width:100%;max-width:680px;margin:0 auto 6px;background:linear-gradient(135deg,rgba(10,132,255,.13),rgba(94,92,230,.13));border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px 26px;text-align:center}

body.light .auth-or{color:#9a9aa2}body.light .auth-or::before,body.light .auth-or::after{background:rgba(0,0,0,.12)}
body.light .tool-btn{background:#fff;border-color:rgba(0,0,0,.09);color:#33333a}
body.light .tool-btn:hover{background:#fff;border-color:rgba(0,0,0,.22)}
body.light .sc-row{background:rgba(0,0,0,.04)}body.light .sc-row kbd{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.14);color:#333}
body.light .fab-item{background:rgba(255,255,255,.98);color:#26262c;border-color:rgba(0,0,0,.1)}
body.light .acc-card{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.08)}
